<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudForge PaaS · 全功能平台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f5f9;--surface:#fff;--border:#e5e7ee;
  --text:#161a23;--text2:#6b7280;--text3:#9aa1af;
  --primary:#4257d8;--primary-soft:#eef0fe;
  --green:#0fa968;--green-soft:#e6f7f0;
  --amber:#e8930c;--amber-soft:#fdf4e3;
  --red:#e5484d;--red-soft:#fdecec;
  --mesh:#7c5cbf;--mesh-soft:#f2eefb;
  --radius:10px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:13px;-webkit-font-smoothing:antialiased;
  min-width: 860px; overflow-x: auto;
}
a{cursor:pointer;color:var(--primary);text-decoration:none}
button{font-family:inherit; white-space: nowrap;}
.gi{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle;flex-shrink:0}

/* 顶栏 */
.topbar{height:56px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:50;min-width:860px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#4257d8,#7b8cf0);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:14px}
.env-select{border:1px solid var(--border);background:#fafbfd;border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--text2);outline:none;cursor:pointer}
.avatar{width:30px;height:30px;border-radius:50%;background:#eef0fe;color:var(--primary);display:grid;place-items:center;font-size:12px;font-weight:600}

/* 布局 */
.layout{display:flex;min-height:calc(100vh - 56px);min-width:860px}
.sidebar{width:200px;background:#fff;border-right:1px solid var(--border);padding:12px 10px;flex-shrink:0}
.nav-group{font-size:11px;color:var(--text3);padding:8px 12px 6px;letter-spacing:.5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;color:var(--text2);cursor:pointer;font-size:13px;margin-bottom:2px;transition:.15s;white-space:nowrap}
.nav-item:hover{background:#f7f8fc}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-item .ico{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;flex-shrink:0}
.nav-item .ico .gi{width:15px;height:15px}
main{flex:1;min-width:0}

/* 通用组件 */
.page{padding:24px 28px;max-width:1400px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:16px}
h1{font-size:20px;font-weight:600;letter-spacing:-.2px;white-space:nowrap}
.sub{color:var(--text2);margin-top:5px;font-size:13px}
.btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:7px 14px;font-size:12.5px;cursor:pointer;color:var(--text);transition:.15s;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#c9cfe6;background:#fafbff}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:#3648c4}
.btn.mesh{background:var(--mesh);border-color:var(--mesh);color:#fff}
.btn.mesh:hover{background:#6a4ca8}
.btn.sm{padding:4px 10px;font-size:12px}
a.btn{color:var(--text)}
a.btn.primary{color:#fff}

/* 快速访问链接样式 */
.link-access{display:inline-flex;align-items:center;gap:4px;color:var(--primary);font-size:12.5px;font-weight:500;transition:.15s}
.link-access:hover{text-decoration:underline}
.link-access .gi{width:12px;height:12px}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.gray{background:#f1f2f6;color:var(--text2)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.blue{background:var(--primary-soft);color:var(--primary)}
.badge.mesh{background:var(--mesh-soft);color:var(--mesh)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot.green{background:var(--green)}.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}

/* 表格防挤压 */
table.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;table-layout:fixed}
th{text-align:left;font-size:12px;color:var(--text3);font-weight:500;padding:11px 16px;background:#fafbfc;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:15px 16px;border-bottom:1px solid #f1f2f6;font-size:13px;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:.12s}
tbody tr:hover{background:#fafbff}
.app-cell{display:flex;align-items:center;gap:11px;min-width:180px}
.app-ico{width:32px;height:32px;border-radius:8px;background:var(--primary-soft);display:grid;place-items:center;flex-shrink:0;color:var(--primary)}
.app-ico .gi{width:17px;height:17px}
.app-cell b{font-weight:600;display:block;white-space:nowrap}
.app-cell span{color:var(--text2);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}

/* 列表筛选与资源概览 */
.list-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px}
.list-toolbar .form-control{width:auto;min-width:180px;padding:8px 10px;font-size:12.5px}
.list-toolbar .search-input{flex:1;min-width:220px}
.resource-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.resource-stat{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.resource-stat .label{font-size:12px;color:var(--text2)}.resource-stat .value{font-size:22px;font-weight:650;margin-top:7px}.resource-stat .hint{font-size:11px;color:var(--text3);margin-top:3px}
.row-actions{display:flex;gap:6px;align-items:center}.row-actions .btn{padding:4px 8px;font-size:11.5px}
.persist-note{font-size:11.5px;color:var(--text3);margin-top:12px;display:flex;align-items:center;gap:6px}
/* 拓扑页 */
.app-shell{display:flex;height:calc(100vh - 56px);min-width:860px;position:relative;overflow:hidden}
.app-left{flex:1;display:flex;flex-direction:column;min-width:0;transition:all .3s ease}
.app-topbar{background:#fff;border-bottom:1px solid var(--border);padding:16px 24px;flex-shrink:0}
.crumbs{font-size:12.5px;color:var(--text3);margin-bottom:10px;display:flex;gap:7px;align-items:center;white-space:nowrap}
.crumbs b{color:var(--text);font-weight:500}
.app-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.app-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}

.mesh-bar{display:flex;align-items:center;gap:10px;padding:9px 24px;background:var(--mesh-soft);border-bottom:1px solid #e2daf3;font-size:12px;color:var(--mesh);flex-shrink:0;white-space:nowrap;overflow-x:auto}
.mesh-bar .gi{width:14px;height:14px}
.mesh-bar b{font-weight:600}

.canvas-scroll{flex:1;overflow:auto;padding:24px;background:#fbfbfd;background-image:radial-gradient(#dde0ea 1px,transparent 1px);background-size:22px 22px}
.canvas{position:relative;min-width:100%;min-height:100%}
svg#edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}

.node{position:absolute;width:184px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:11px 13px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;z-index:2;user-select:none}
.node:hover{border-color:#b9c0e8;box-shadow:0 5px 16px rgba(66,87,216,.13);transform:translateY(-1px)}
.node.selected{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft),0 5px 16px rgba(66,87,216,.15)}
.node.mesh-node{border-left:3px solid var(--mesh)}
.node-head{display:flex;align-items:center;gap:7px}
.node-icon{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;flex-shrink:0;color:var(--primary)}
.node-icon .gi{width:14px;height:14px}
.node-name{font-weight:600;font-size:12.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node-meta{font-size:11.5px;color:var(--text2);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node-wl{margin-top:8px;padding-top:7px;border-top:1px dashed #eceef4;display:flex;justify-content:space-between;font-size:11px;color:var(--text3)}
.node-wl b{color:var(--primary);font-weight:600}
.node-sidecar{margin-top:7px;font-size:10.5px;display:flex;align-items:center;gap:5px;color:var(--text3);white-space:nowrap}
.sidecar-pill{padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600}
.sidecar-pill.on{background:var(--mesh-soft);color:var(--mesh)}
.sidecar-pill.off{background:#f1f2f6;color:var(--text3)}

/* 虚拟入口节点 */
.node-entry{position:absolute;width:180px;background:#fff;border:2px dashed var(--primary);border-radius:10px;padding:12px;z-index:3;box-shadow:0 4px 12px rgba(66,87,216,.08)}
.node-entry .entry-head{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--primary);margin-bottom:6px}
.node-entry .entry-desc{font-size:11px;color:var(--text2);line-height:1.4}

/* 检查器 */
.inspector{width:380px;background:#fff;border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .3s ease;position:relative}
.inspector.collapsed{width:0;border-left:none;overflow:hidden}
.inspector.collapsed #inspector{opacity:0}
#inspector{display:flex;flex-direction:column;flex:1;min-height:0;transition:opacity .2s ease}
.inspector-head{padding:20px 20px 0;position:relative}
.btn-collapse{position:absolute;top:20px;right:20px;background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;border-radius:4px;display:flex;align-items:center;justify-content:center}
.btn-collapse:hover{background:#f1f2f6;color:var(--text)}
.insp-title{display:flex;align-items:center;gap:11px;padding-right:30px}
.insp-icon{width:38px;height:38px;border-radius:10px;background:var(--primary-soft);display:grid;place-items:center;flex-shrink:0;color:var(--primary)}
.insp-icon .gi{width:18px;height:18px}
.insp-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insp-sub{font-size:12px;color:var(--text2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);padding:16px 20px 0;flex-shrink:0;overflow-x:auto}
.tab{padding:8px 10px;font-size:12.5px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-color:var(--primary);font-weight:600}
.tab.mesh-tab.active{color:var(--mesh);border-color:var(--mesh)}
.inspector-body{padding:16px 20px 24px;overflow-y:auto;flex:1;min-height:0}
.section-title{font-size:11.5px;color:var(--text3);font-weight:600;letter-spacing:.4px;margin:18px 0 8px;text-transform:uppercase}
.section-title:first-child{margin-top:0}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dashed #f1f2f6;font-size:12.5px;align-items:flex-start}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--text2);flex-shrink:0;white-space:nowrap}
.kv .v{font-weight:500;text-align:right;word-break:break-all}
.chip{display:inline-block;padding:3px 9px;background:#f4f5f9;border-radius:6px;font-size:11.5px;color:var(--text2);margin:0 6px 6px 0}
.env-row{display:flex;gap:8px;padding:8px 0;border-bottom:1px dashed #f1f2f6;font-size:12px}
.env-row .ek{color:var(--primary);font-family:ui-monospace,Menlo,monospace;flex-shrink:0;white-space:nowrap}
.env-row .ev{color:var(--text2);word-break:break-all;text-align:right;flex:1}
.empty{padding:40px 20px;text-align:center;color:var(--text3);font-size:12.5px}
.wl-entry{background:#fafbff;border:1px solid #e4e8fb;border-radius:9px;padding:14px;margin-top:14px}
.wl-entry .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.wl-entry .t b{font-size:13px}
.wl-entry .btn{width:100%;margin-top:12px;text-align:center;display:block;justify-content:center}

/* 悬浮展开按钮 */
.floating-expand{position:absolute;right:0;top:50%;transform:translateY(-50%);width:24px;height:48px;background:#fff;border:1px solid var(--border);border-right:none;border-radius:8px 0 0 8px;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:-2px 0 6px rgba(0,0,0,0.05);z-index:20;color:var(--text3)}
.floating-expand:hover{color:var(--primary);background:#fafbff}
.inspector.collapsed ~ .floating-expand{display:flex}

.mesh-panel{background:var(--mesh-soft);border:1px solid #e2daf3;border-radius:9px;padding:14px;margin-top:14px}
.mesh-panel .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mesh-panel .mh b{font-size:13px;color:var(--mesh)}
.weight-row{display:flex;align-items:center;gap:10px;padding:7px 0}
.weight-row .wl-label{width:64px;font-size:11.5px;color:var(--text2);flex-shrink:0}
.weight-bar-bg{flex:1;height:6px;background:#e8e3f3;border-radius:3px;overflow:hidden}
.weight-bar{height:100%;border-radius:3px;background:var(--mesh);transition:width .3s}
.weight-row .wl-pct{width:38px;text-align:right;font-size:11.5px;font-weight:600;color:var(--mesh)}
.mesh-kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed #e2daf3;font-size:12px}
.mesh-kv:last-child{border-bottom:none}
.mesh-kv .k{color:var(--text2);white-space:nowrap}
.mesh-kv .v{font-weight:500;color:var(--mesh);text-align:right}

/* 工作负载诊断增强 */
.wl-progress{height:5px;background:#edf0f6;border-radius:5px;overflow:hidden;margin-top:10px}.wl-progress span{display:block;height:100%;border-radius:5px;transition:width .2s}
.stat-note{font-size:11px;color:var(--text3);margin-top:7px;white-space:normal}
.pod-row{cursor:pointer}.pod-row:hover{background:#f8faff}.muted{font-size:11px;color:var(--text3);margin-top:3px}.condition-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px;padding:6px 18px 12px}.condition-item{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #f0f2f7;min-width:0}.condition-item>b,.condition-item div:nth-child(2){min-width:0}.condition-item>div:nth-child(2){flex:1}.condition-item b{font-size:12px}.condition-icon{width:23px;height:23px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}.condition-icon.ok{background:var(--green-soft);color:var(--green)}.condition-icon.bad{background:var(--amber-soft);color:var(--amber)}.condition-detail{font-size:11px;color:var(--text3);margin-top:4px}.diagnostic-foot{font-size:11px;line-height:1.6;color:var(--text3);padding:10px 18px;background:#fafbfe;border-top:1px solid #f0f2f7}.pod-detail-banner{display:flex;align-items:center;gap:12px;padding:12px;background:#f8faff;border:1px solid var(--border);border-radius:8px;margin-bottom:16px}.detail-kv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.detail-kv-grid>div{padding:11px 12px;border:1px solid var(--border);border-radius:8px;min-width:0}.detail-kv-grid span{display:block;font-size:11px;color:var(--text3);margin-bottom:5px}.detail-kv-grid b{display:block;font-size:12px;overflow-wrap:anywhere}.readonly-code{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#f7f8fc;border:1px solid var(--border);border-radius:7px;padding:10px;overflow-wrap:anywhere}.log-toolbar{display:flex;gap:8px;margin-bottom:12px}.log-toolbar .form-control{min-width:0;flex:1}.log-output{background:#111827;color:#d8e0ee;border-radius:8px;padding:12px;max-height:360px;overflow:auto;font:11px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace}.log-line{display:grid;grid-template-columns:190px 48px minmax(0,1fr);gap:10px;padding:2px 0;overflow-wrap:anywhere}.log-time{color:#9ca9be}.log-level{font-weight:700}.log-level.info{color:#79c0ff}.log-level.warn{color:#e3b341}.log-level.error{color:#ff7b72}.table-scroll{overflow-x:auto}
@media(max-width:900px){.wl-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.condition-grid{grid-template-columns:1fr}.log-line{grid-template-columns:1fr;gap:1px}.log-time{font-size:10px}.log-toolbar{flex-wrap:wrap}.detail-kv-grid{grid-template-columns:1fr}}

/* 工作负载详情 */
.wl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;white-space:nowrap}
.stat .label{font-size:12px;color:var(--text2)}
.stat .value{font-size:19px;font-weight:600;margin-top:7px;letter-spacing:-.3px}
.stat .value small{font-size:12px;color:var(--text3);font-weight:400}
.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:18px;overflow:hidden}
.panel-head{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:600;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.panel-head .hint{font-weight:400;font-size:12px;color:var(--text3)}
.panel table{width:100%;border-collapse:collapse}
.panel td,.panel th{border-bottom:1px solid #f3f4f8}
.panel tr:last-child td{border-bottom:none}
.timeline{padding:8px 18px 14px}
.tl-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed #f1f2f6;font-size:12.5px}
.tl-item:last-child{border-bottom:none}
.tl-time{color:var(--text3);font-size:11.5px;width:74px;flex-shrink:0;font-family:ui-monospace,Menlo,monospace;white-space:nowrap}
.tl-body{flex:1}
.tl-body .r{font-weight:600;font-size:12px;margin-bottom:2px}
.tl-body .m{color:var(--text2);font-size:12px;line-height:1.5}

/* 进度条 */
.progress-bg{width:60px;height:6px;background:#e5e7ee;border-radius:3px;display:inline-block;vertical-align:middle;margin-right:8px;overflow:hidden}
.progress-bar{height:100%;border-radius:3px;background:var(--primary)}
.progress-bar.warn{background:var(--amber)}
.progress-bar.danger{background:var(--red)}

/* ===== 原型增强：编排、校验与发布 ===== */
.comp-deps{margin-top:12px;padding:12px;background:#fff;border:1px solid var(--border);border-radius:8px}
.comp-deps-title{font-size:12px;font-weight:600;margin-bottom:8px;color:var(--text2)}
.dep-checks{display:flex;gap:8px;flex-wrap:wrap}
.dep-check{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:6px;padding:6px 9px;background:#fff;font-size:12px;cursor:pointer}
.dep-check input{accent-color:var(--primary)}
.validation-box{padding:12px 14px;border-radius:8px;margin:12px 0;font-size:12.5px;line-height:1.7}
.validation-box.error{background:var(--red-soft);color:#a6282d;border:1px solid #f5c7c8}
.validation-box.success{background:var(--green-soft);color:#087647;border:1px solid #bfe9d6}
.validation-box.warn{background:var(--amber-soft);color:#8d5a00;border:1px solid #f4dfb4}
.modal-mask{position:fixed;inset:0;background:rgba(20,24,38,.42);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-card{width:min(620px,100%);max-height:85vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(10,20,40,.22);padding:24px}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
.modal-head h2{font-size:18px;font-weight:650}.modal-close{border:0;background:none;color:var(--text3);font-size:22px;cursor:pointer}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px;padding-top:16px;border-top:1px solid var(--border)}
.release-row{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid #f0f1f5}.release-row:last-child{border-bottom:0}
.release-dot{width:9px;height:9px;border-radius:50%;background:var(--green);margin-top:5px;flex-shrink:0}
.release-meta{font-size:12px;color:var(--text2);margin-top:5px;line-height:1.6}
.topology-toolbar{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
/* ===== 新建应用向导 ===== */
.wizard-page{max-width:800px;margin:0 auto;padding:40px 24px;}
.stepper{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;position:relative}
.stepper::before{content:'';position:absolute;top:16px;left:40px;right:40px;height:2px;background:#e5e7ee;z-index:1}
.step{display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2;background:var(--bg);padding:0 10px;cursor:pointer}
.step-num{width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid #e5e7ee;display:grid;place-items:center;font-weight:600;color:var(--text3);transition:.2s}
.step.active .step-num{border-color:var(--primary);background:var(--primary);color:#fff}
.step.done .step-num{border-color:var(--green);background:var(--green);color:#fff}
.step-label{font-size:12.5px;color:var(--text3);font-weight:500}
.step.active .step-label{color:var(--primary)}
.step.done .step-label{color:var(--green)}

.wizard-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:32px;box-shadow:var(--shadow)}
.wizard-card h2{font-size:18px;margin-bottom:24px;font-weight:600;border-bottom:1px solid #f1f2f6;padding-bottom:16px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-weight:500;margin-bottom:8px;color:var(--text)}
.form-group label span{color:var(--red);margin-left:4px}
.form-control{width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13.5px;outline:none;transition:.15s;font-family:inherit}
.form-control:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:20px}

/* 模板推荐卡片 */
.template-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:24px}
.template-card{border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;transition:.2s;background:#fff;display:flex;flex-direction:column}
.template-card:hover{border-color:var(--primary);box-shadow:0 4px 12px rgba(66,87,216,.1);background:#fafbff}
.template-card .t-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;color:var(--primary);font-weight:600;font-size:14px}
.template-card .t-desc{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:12px;flex:1}
.template-card .t-tags{display:flex;gap:6px;flex-wrap:wrap}

.mesh-toggle-card{background:var(--mesh-soft);border:1px solid #e2daf3;border-radius:10px;padding:20px;display:flex;align-items:flex-start;gap:16px}
.mesh-toggle-card .gi{color:var(--mesh);width:24px;height:24px;margin-top:2px}
.mesh-toggle-card h4{font-size:14px;color:var(--mesh);margin-bottom:6px}
.mesh-toggle-card p{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:12px}
.switch{position:relative;display:inline-block;width:40px;height:22px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#ccc;transition:.3s;border-radius:22px}
.slider:before{position:absolute;content:"";height:16px;width:16px;left:3px;bottom:3px;background-color:white;transition:.3s;border-radius:50%}
input:checked + .slider{background-color:var(--mesh)}
input:checked + .slider:before{transform:translateX(18px)}

.comp-list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.comp-item{display:flex;gap:16px;align-items:flex-start;padding:16px;border:1px solid var(--border);border-radius:10px;margin-bottom:12px;background:#fafbfd;position:relative}
.comp-item .btn-remove{position:absolute;top:12px;right:12px;color:var(--text3);cursor:pointer;background:none;border:none;padding:4px}
.comp-item .btn-remove:hover{color:var(--red)}
.comp-col{flex:1}
.comp-col label{font-size:12px;color:var(--text3);margin-bottom:6px;display:block}
.wl-preview{background:#fff;border:1px dashed var(--border);border-radius:8px;padding:12px;margin-top:12px;display:flex;align-items:center;gap:12px;font-size:12.5px}
.wl-preview .gi{color:var(--primary)}

.smart-recommend{background:#eef0fe;border:1px solid #d6ddfe;border-radius:10px;padding:16px;margin-bottom:20px;display:flex;align-items:flex-start;gap:12px;animation:slideDown 0.3s ease}
.smart-recommend .gi{color:var(--primary);width:20px;height:20px;flex-shrink:0}
.smart-recommend .r-text{flex:1;font-size:13px;color:var(--text)}
.smart-recommend .r-actions{display:flex;gap:8px;margin-top:10px}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

.summary-section{background:#fafbfd;border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:20px}
.summary-row{display:flex;justify-content:space-between;margin-bottom:12px;font-size:13px;border-bottom:1px dashed #f1f2f6;padding-bottom:12px}
.summary-row:last-child{border:none;margin-bottom:0;padding-bottom:0}
.summary-row .k{color:var(--text2)}
.summary-row .v{font-weight:600}
.tree-node{margin-left:20px;position:relative;padding:8px 0;font-size:13px}
.tree-node::before{content:'';position:absolute;left:-14px;top:16px;width:10px;height:1px;background:#c8cdda}
.tree-node::after{content:'';position:absolute;left:-14px;top:-10px;bottom:16px;width:1px;background:#c8cdda}
.tree-node:last-child::after{bottom:auto;height:26px}
.tree-root{font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tree-root .gi{color:var(--primary)}

.wizard-footer{display:flex;justify-content:flex-end;gap:12px;margin-top:32px;padding-top:20px;border-top:1px solid #f1f2f6}

/* 网关与路由治理 */
.gateway-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}
.gateway-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:17px;min-width:0}
.gateway-card h3{font-size:14px;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.gateway-card p{color:var(--text2);line-height:1.6;font-size:12px}
.gateway-card .metric{font-size:20px;font-weight:650;margin:12px 0 5px}
.gateway-card .card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.gateway-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:16px;align-items:start}
.gateway-panel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;min-width:0}
.gateway-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:15px}
.gateway-panel-head h2{font-size:15px;margin-bottom:5px}.gateway-panel-head p{color:var(--text2);font-size:12px;line-height:1.5}
.gateway-kv{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid #f0f1f5;align-items:center}.gateway-kv:last-child{border-bottom:0}.gateway-kv .k{color:var(--text2)}
.route-path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#f5f6fa;padding:4px 7px;border-radius:5px;display:inline-block}
.weight-track{height:9px;border-radius:10px;overflow:hidden;background:#e9ebf4;display:flex;margin:12px 0 8px}.weight-stable{background:#4257d8;height:100%}.weight-canary{background:#0fa968;height:100%}
.weight-legend{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--text2)}
.range-row{display:flex;align-items:center;gap:12px;margin:16px 0}.range-row input{flex:1;min-width:80px;accent-color:var(--primary)}.range-value{font-weight:650;min-width:45px;text-align:right}
.notice{padding:11px 12px;background:#f6f7fb;border:1px solid var(--border);border-radius:8px;color:var(--text2);line-height:1.6;font-size:12px}
.form-help{font-size:11px;color:var(--text3);margin-top:5px;line-height:1.5}
@media(max-width:1100px){.gateway-grid{grid-template-columns:1fr}.gateway-layout{grid-template-columns:1fr}}
.gateway-page-head{align-items:center}
.gateway-page-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.gateway-page-actions .form-control{width:220px;min-height:36px}
.gateway-context-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:14px;border:1px solid var(--border);border-radius:10px;background:var(--surface);overflow:hidden}
.gateway-context-item{min-width:0;padding:12px 14px;border-left:1px solid var(--border)}
.gateway-context-item:first-child{border-left:0}
.gateway-context-item>span{display:block;font-size:11px;color:var(--text2)}
.gateway-context-item>b{display:block;margin-top:5px;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gateway-context-item>small{display:block;margin-top:4px;font-size:11px;color:var(--text3);line-height:1.4}
.gateway-context-action{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gateway-workbench{display:grid;grid-template-columns:332px minmax(0,1fr);gap:14px;align-items:start}
.gateway-route-panel,.gateway-detail-panel{border:1px solid var(--border);border-radius:10px;background:var(--surface);min-width:0;overflow:hidden}
.gateway-route-panel-head,.gateway-detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:15px 16px;border-bottom:1px solid var(--border)}
.gateway-route-panel-head h2,.gateway-detail-head h2{font-size:15px;margin:0}
.gateway-route-panel-head p,.gateway-detail-head p{font-size:11.5px;color:var(--text2);line-height:1.5;margin-top:4px}
.gateway-route-list{display:grid;gap:7px;padding:9px}
.gateway-route-item{appearance:none;width:100%;min-width:0;padding:11px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);text-align:left;font:inherit;transition:border-color .15s,background .15s,transform .15s}
.gateway-route-item:hover{border-color:#c7cee6;background:var(--surface2,#f7f8fc);transform:translateY(-1px)}
.gateway-route-item.is-active{border-color:#bfc8f6;background:var(--primary-soft);box-shadow:inset 3px 0 var(--primary)}
.gateway-route-item-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gateway-route-item-top b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gateway-route-match{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:7px}
.gateway-route-match code{padding:3px 6px;border-radius:5px;background:rgba(72,82,110,.07);font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.gateway-route-target{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:11px;color:var(--text2)}
.gateway-route-target span:first-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gateway-route-empty{padding:34px 20px;text-align:center;color:var(--text2)}
.gateway-route-empty b{display:block;color:var(--text);margin-bottom:6px}
.gateway-detail-head{background:linear-gradient(180deg,var(--surface),var(--surface2,#f7f8fc))}
.gateway-detail-title{min-width:0}
.gateway-detail-title h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gateway-detail-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.gateway-detail-tabs{display:flex;gap:3px;padding:8px 12px 0;border-bottom:1px solid var(--border);overflow-x:auto}
.gateway-detail-tab{appearance:none;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--text2);padding:9px 12px 10px;font:500 12px/1 inherit;white-space:nowrap}
.gateway-detail-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.gateway-detail-content{padding:16px}
.gateway-traffic-path{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:12px;border-radius:9px;background:var(--surface2,#f7f8fc);border:1px solid var(--border)}
.gateway-path-node{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:7px;background:var(--surface);border:1px solid var(--border);font-size:11px;white-space:nowrap}
.gateway-path-node.primary{background:var(--primary-soft);border-color:transparent;color:var(--primary)}
.gateway-path-node.success{background:var(--green-soft);border-color:transparent;color:var(--green)}
.gateway-path-arrow{color:var(--text3)}
.gateway-detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin-top:15px;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--border)}
.gateway-detail-field{padding:11px 12px;background:var(--surface);min-width:0}
.gateway-detail-field span{display:block;font-size:10.5px;color:var(--text3)}
.gateway-detail-field b,.gateway-detail-field code{display:block;margin-top:5px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gateway-settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}
.gateway-settings-grid h3{font-size:12px;margin:0 0 7px}
.gateway-settings-grid .form-control{width:100%}
.gateway-settings-value{padding:8px 0;font-size:12px;font-weight:600;overflow-wrap:anywhere}
.gateway-traffic-panel{max-width:720px}
.gateway-traffic-panel .gateway-kv{grid-template-columns:118px minmax(0,1fr)}
.gateway-traffic-panel .range-row{margin:13px 0}
.gateway-check-list{display:grid;gap:8px}
.gateway-check-item{display:flex;align-items:flex-start;gap:9px;padding:10px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface2,#f7f8fc)}
.gateway-check-icon{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700;flex-shrink:0}
.gateway-check-icon.ok{background:var(--green-soft);color:var(--green)}.gateway-check-icon.warn{background:var(--amber-soft);color:var(--amber)}.gateway-check-icon.error{background:var(--red-soft);color:var(--red)}
.gateway-check-item b{display:block;font-size:12px}.gateway-check-item div div{font-size:11px;color:var(--text2);line-height:1.5;margin-top:3px}
.gateway-detail-empty{padding:48px 24px;text-align:center;color:var(--text2)}
.gateway-detail-empty b{display:block;margin-bottom:7px;color:var(--text)}
@media(max-width:1000px){
  .gateway-context-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gateway-context-item:nth-child(3){border-left:0;border-top:1px solid var(--border)}
  .gateway-context-item:nth-child(4){border-top:1px solid var(--border)}
  .gateway-workbench{grid-template-columns:1fr}
  .gateway-route-list{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:700px){
  .gateway-page-head,.gateway-page-actions{align-items:stretch;width:100%}
  .gateway-page-actions .form-control{width:100%}
  .gateway-context-strip,.gateway-route-list,.gateway-detail-grid,.gateway-settings-grid{grid-template-columns:1fr}
  .gateway-context-item{border-left:0;border-top:1px solid var(--border)}
  .gateway-context-item:first-child{border-top:0}
  .gateway-detail-head{flex-direction:column}
  .gateway-detail-actions{justify-content:flex-start}
  .gateway-detail-content{padding:13px}
}

/* 运行配置表单体验优化 */
.runtime-config-scroll{max-height:68vh;overflow:auto;padding:2px 6px 10px 0}
.runtime-block{padding:16px 0;border-bottom:1px solid var(--border)}.runtime-block:last-of-type{border-bottom:0}
.runtime-block-title{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px}.runtime-block-title h3{font-size:14px;font-weight:650}.runtime-block-title p{color:var(--text2);font-size:12px;margin-top:5px;line-height:1.5}
.runtime-env-table{border:1px solid var(--border);border-radius:9px;overflow:hidden;margin-bottom:9px}.runtime-env-header,.runtime-env-row{display:grid;grid-template-columns:minmax(130px,1fr) 130px minmax(180px,1.4fr) 58px;gap:8px;align-items:center;padding:9px 10px}.runtime-env-header{background:#f8f9fc;color:var(--text2);font-size:11px;border-bottom:1px solid var(--border)}.runtime-env-row+.runtime-env-row{border-top:1px solid #f0f1f5}.runtime-env-row .form-control{min-width:0;width:100%;padding:7px 8px;font-size:12px}.runtime-env-remove{justify-content:center;padding:6px 7px;color:var(--red)}
.runtime-probe-card{border:1px solid var(--border);border-radius:10px;padding:13px 14px;margin:10px 0;background:#fff}.runtime-probe-head{display:flex;justify-content:space-between;align-items:center;gap:14px}.runtime-probe-head b{font-size:13px}.runtime-probe-head .form-help{margin-top:4px}.runtime-probe-fields{padding-top:13px}.runtime-probe-tip{font-size:11px;color:var(--text2);background:#f7f8fc;border-radius:7px;padding:8px 10px;margin-top:8px;line-height:1.5}
.runtime-switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;font-size:12px;color:var(--text2)}.runtime-switch input{position:absolute;opacity:0;width:1px;height:1px}.runtime-switch-track{width:34px;height:19px;border-radius:20px;background:#c9ced9;position:relative;transition:.18s;flex-shrink:0}.runtime-switch-track:after{content:'';position:absolute;width:15px;height:15px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0002;transition:.18s}.runtime-switch input:checked+.runtime-switch-track{background:var(--primary)}.runtime-switch input:checked+.runtime-switch-track:after{transform:translateX(15px)}.runtime-switch input:focus-visible+.runtime-switch-track{outline:2px solid var(--primary);outline-offset:2px}
.runtime-config-scroll code{background:#f0f2f8;border-radius:4px;padding:2px 4px;font-size:11px}
.runtime-env-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.runtime-env-tools .form-control{max-width:280px;min-width:180px}.runtime-env-row.env-hidden{display:none!important}.runtime-inline-note{font-size:11px;color:var(--text2);margin:6px 0}.runtime-diff{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.runtime-diff>div{border:1px solid var(--border);border-radius:8px;padding:10px;min-width:0}.runtime-diff b{display:block;font-size:11px;color:var(--text2);margin-bottom:5px}.runtime-diff code{display:block;overflow-wrap:anywhere;font-size:12px}.runtime-field-error{border-color:#dc5454!important;box-shadow:0 0 0 2px #dc54541a}.runtime-import-area{min-height:190px;font-family:ui-monospace,monospace;font-size:12px}

  const stored = localStorage.getItem(DEMO_STORAGE_KEY);

// 工作负载独立资源模型：组件只保留 workloadId 引用；运行时状态存入独立 WORKLOADS 注册表。
// 兼容旧版数据：首次加载时会把组件内嵌的 workload 迁移到独立存储。
const WORKLOAD_STORAGE_KEY = 'cloudforge-workloads-v1';
let WORKLOADS = {};
try {
  const savedWorkloads = JSON.parse(localStorage.getItem(WORKLOAD_STORAGE_KEY) || 'null');
  if (savedWorkloads && typeof savedWorkloads === 'object' && !Array.isArray(savedWorkloads)) WORKLOADS = savedWorkloads;
} catch (e) { console.warn('工作负载资源读取失败，将从组件兼容数据迁移。', e); }

}catch(e){console.warn('组件版本读取失败，将重新生成。',e);}
function attachWorkloadReference(app, component, initialWorkload) {
  const oldWorkload = initialWorkload || (Object.prototype.hasOwnProperty.call(component, 'workload') ? component.workload : null);
  const legacyIds = Array.isArray(component.workloadIds) ? component.workloadIds.filter(id => id && WORKLOADS[id]) : [];
  const workloadId = component.workloadId || legacyIds[0] || (oldWorkload ? `wl-${app.id}-${component.id}` : '');
  component.workloadId = workloadId;
  try{Object.defineProperty(component,'_appId',{configurable:true,enumerable:false,value:app.id});}catch(e){}
  if (workloadId && !WORKLOADS[workloadId] && oldWorkload) WORKLOADS[workloadId] = oldWorkload;
  // 迁移旧版多关联数据：只保留主工作负载引用，其余资源保留在注册表中，
  // 作为独立运行资源（例如蓝绿/灰度发布临时目标），不再挂在业务组件下面。
  const extras = [...new Set([...legacyIds, ...legacyIds.filter(id => id !== workloadId)])].filter(id => id !== workloadId);
  extras.forEach(id => {
    const w = WORKLOADS[id];
    if (w) { w._ownerAppId = app.id; w._ownerComponentId = ''; w._detachedFromComponentAt = w._detachedFromComponentAt || new Date().toISOString(); }
  });
  component.workloadIds = workloadId && WORKLOADS[workloadId] ? [workloadId] : [];
  if (workloadId && WORKLOADS[workloadId]) { WORKLOADS[workloadId]._ownerAppId = app.id; WORKLOADS[workloadId]._ownerComponentId = component.id; if(!WORKLOADS[workloadId].name) WORKLOADS[workloadId].name = `${component.name}-runtime`; }
  try { delete component.workload; } catch (e) {}
  Object.defineProperty(component, 'workload', {
    configurable: true, enumerable: false,
    get() { return this.workloadId && WORKLOADS[this.workloadId] ? WORKLOADS[this.workloadId] : null; },
    set(value) { const id = this.workloadId; if (value == null) { if(id) delete WORKLOADS[id]; } else { if(id) WORKLOADS[id] = value; } }
  });
}
function attachAllWorkloadReferences() {
  APPS.forEach(app => (app.components || []).forEach(component => attachWorkloadReference(app, component)));

  if(!app.releases) app.releases = [{version:app.version || 'v1.0.0', status:'success', strategy:'滚动发布', notes:'当前运行版本', time:app.updatedAt || '刚刚', operator:app.owner || '当前用户', current:true}];
  if(!app.releases.some(r=>r.version===app.version)) app.releases.unshift({version:app.version,status:'success',strategy:'滚动发布',notes:'当前运行版本',time:app.updatedAt || '刚刚',operator:app.owner || '当前用户',current:true});
  let currentAssigned=false; app.releases.forEach((r,i)=>{if(!r.id)r.id=`rel-legacy-${String(r.version||i).replace(/[^a-zA-Z0-9.-]/g,'-')}`;if(!Array.isArray(r.events))r.events=[];if(!Array.isArray(r.targetWorkloadIds))r.targetWorkloadIds=[];r.current = !currentAssigned && r.version === app.version; if(r.current) currentAssigned=true;});
  const currentRelease=app.releases.find(r=>r.current); if(currentRelease && !currentRelease.snapshot) currentRelease.snapshot=captureReleaseSnapshot(app,currentRelease.version);
  return app.releases;
}

function validateComponentDependencies(app, candidate, editingId){

}

function compareReleaseVersion(appId, version){

  showModal(`<div class="modal-head"><div><h2>版本变更对比</h2><div class="sub">${escapeHtml(app.name)} · 当前 ${escapeHtml(app.version||'—')} → 目标 ${escapeHtml(target.version)}</div></div><button class="modal-close" onclick="closeModal()">×</button></div><div class="resource-stats"><div class="resource-stat"><div class="label">目标状态</div><div class="value"><span class="badge ${statusColor}">${statusLabel}</span></div></div><div class="resource-stat"><div class="label">发布策略</div><div class="value" style="font-size:16px">${escapeHtml(target.strategy||'—')}</div></div><div class="resource-stat"><div class="label">记录时间</div><div class="value" style="font-size:13px">${escapeHtml(target.time||'—')}</div></div></div><p class="sub" style="margin:12px 0">变更说明：${escapeHtml(target.notes||'—')}</p><table class="card"><thead><tr><th>组件</th><th>当前镜像</th><th>目标镜像（模拟）</th><th>差异</th></tr></thead><tbody>${imageRows||'<tr><td colspan="4">无组件</td></tr>'}</tbody></table><div class="validation-box warn" style="margin-top:12px">${target.snapshot?'该版本包含配置快照：镜像、环境变量、健康探针、资源、依赖与网格配置；Secret 值仅保存脱敏占位，不在快照中保存明文。':'该历史记录创建于快照功能启用前，无法完整还原环境变量、探针和资源配置。'}</div><div class="modal-actions"><button class="btn" onclick="closeModal()">关闭</button>${!target.current&&target.status==='success'?`<button class="btn primary" onclick="closeModal();state.appId='${appId}';openRollbackModal('${escapeHtml(target.version)}')">回滚到此版本</button>`:''}</div>`);

function retryRelease(appId, version){

    </div>

}

/* 向导逻辑 */
function startCreateApp(){
  editingAppId = null;
  draftApp = { name: '', env: 'prod', owner: '张明', desc: '', accessUrl: '', meshEnabled: isCapabilityEnabled('service-mesh'), components: [{ name: 'web-frontend', type: 'gateway', image: 'nginx:latest', deps: [] }] };
  wizardStep = 1; state.view = 'create-app'; render();
}
function createEmptyApp(){
  if(editingAppId) return alert('编辑已有应用时，请通过编排流程保存变更。');
  const name=(draftApp.name||'').trim();
  if(!name) return alert('请先填写应用名称');
  if(APPS.some(a=>String(a.name||'').trim().toLowerCase()===name.toLowerCase())) return alert('应用名称已存在，请更换名称');
  const appId='app-'+Date.now();
  const app={id:appId,name,desc:(draftApp.desc||'').trim()||'空应用：尚未添加组件',env:draftApp.env||'prod',version:'—',status:'empty',lifecycleState:'active',owner:(draftApp.owner||'').trim()||'未指定',updatedAt:new Date().toLocaleString(),accessUrl:(draftApp.accessUrl||'').trim(),mesh:null,components:[],releases:[],gatewayConfig:{appGatewayEnabled:false,clusterIngressEnabled:false,address:''},routes:[],trafficPolicy:{enabled:false}};
  APPS.push(app); editingAppId=null; wizardStep=1; state.view='apps'; render(); openApp(appId);
}
function startEditApp(){
  const app = getApp(state.appId); if(!app) return;
  editingAppId = app.id;
  draftApp = {name:app.name,env:app.env||'prod',owner:app.owner||'',desc:app.desc||'',accessUrl:app.accessUrl||'',meshEnabled:!!app.mesh?.enabled,components:app.components.map((c,i)=>({...{sourceId:c.id},name:c.name,type:c.type,image:c.workload?.image||'',port:c.port||80,protocol:c.protocol||'HTTP',deps:(c.deps||[]).map(id=>app.components.findIndex(x=>x.id===id)).filter(j=>j>=0),replicas:c.workload?.replicas||1}))};
  wizardStep = 2; state.view = 'create-app'; render();
}
function applyTemplate(type) {
  if (type === 'web') {
    draftApp.name = '标准 Web 业务应用'; draftApp.desc='集群入口经应用网关转发到业务服务与数据库'; draftApp.accessUrl = 'https://web-demo.acme.io';
    draftApp.components = [{ name: 'api-gateway', type: 'gateway', image: 'nginx:1.24', deps: [1] }, { name: 'biz-service', type: 'service', image: 'biz:v1', deps: [2] }, { name: 'biz-db', type: 'database', image: 'postgres:15', deps: [] }];
  } else if (type === 'micro') {
    draftApp.name = '微服务 API 直连'; draftApp.desc='集群入口直接路由到业务 Service'; draftApp.accessUrl = 'https://api-demo.acme.io';
    draftApp.components = [{ name: 'core-service', type: 'service', image: 'core:v1', deps: [1] }, { name: 'biz-db', type: 'database', image: 'postgres:15', deps: [] }];
  } else {
    draftApp.name = '实时数据管道'; draftApp.desc='入口接入数据，经消息队列异步交由 Worker 处理'; draftApp.accessUrl = 'https://pipe-demo.acme.io';
    draftApp.components = [{ name: 'ingest-gateway', type: 'gateway', image: 'ingest:v1', deps: [1] }, { name: 'kafka-queue', type: 'custom', image: 'kafka:3.6', deps: [2] }, { name: 'stream-worker', type: 'worker', image: 'worker:v1', deps: [] }];
  }
  render();
}
function applyRecommendedDeps() {
  if (!draftApp.components.some(c => c.type === 'service')) draftApp.components.push({ name: 'biz-service', type: 'service', image: 'biz:latest', deps: [] });
  const target = draftApp.components.findIndex(c=>c.type==='service');
  draftApp.components.forEach(c=>{if(c.type==='gateway') c.deps=[target];});
  render();
}
function nextWizardStep(){
  if (wizardStep === 1) {
    if (!draftApp.name.trim()) return alert('请填写应用名称');
    const duplicate = APPS.some(a=>a.name.trim()===draftApp.name.trim() && a.id!==editingAppId);
    if(duplicate) return alert('应用名称已存在，请更换名称');
  }
  if (wizardStep === 2) {
    const issues = validateDraft();
    if(issues.length) return alert('配置校验未通过：\n• ' + issues.join('\n• '));
  }
  wizardStep = Math.min(3,wizardStep+1); render();
}
function prevWizardStep(){ wizardStep = Math.max(editingAppId?2:1,wizardStep-1); render(); }
function addComponent(){ draftApp.components.push({ name: `service-${draftApp.components.length + 1}`, type: 'service', image: 'app:latest', deps: [] }); render(); }
function removeComponent(index){
  if(draftApp.components.length<=1) return alert('应用至少需要保留一个组件');
  if(!confirm(`确定删除组件「${draftApp.components[index].name}」？相关依赖连线也会被移除。`)) return;
  draftApp.components.splice(index,1);
  draftApp.components.forEach(c=>{c.deps=(c.deps||[]).filter(d=>d!==index).map(d=>d>index?d-1:d);});
  render();
}
function updateComponent(index, field, value){ const c=draftApp.components[index]; c[field] = (field==='port'||field==='replicas')?Number(value):value; if(field==='type'){c.port=({gateway:8080,service:80,database:5432,cache:6379,worker:0,custom:9092}[value]||80);render();} }
function toggleDraftDep(source,target,checked){
  const c=draftApp.components[source]; c.deps=c.deps||[];
  c.deps=checked ? [...new Set([...c.deps,target])] : c.deps.filter(x=>x!==target);
  render();
}
function validateDraft(){
  const issues=[]; const comps=draftApp.components;
  if(!comps.length) issues.push('至少添加一个组件');
  const names=comps.map(c=>(c.name||'').trim().toLowerCase());
  if(names.some(n=>!n)) issues.push('组件名称不能为空');
  if(new Set(names.filter(Boolean)).size!==names.filter(Boolean).length) issues.push('组件名称不能重复');
  comps.forEach((c,i)=>{
    if(!(c.image||'').trim()) issues.push(`组件「${c.name||i+1}」缺少镜像`);
    const portValue=c.port ?? ({gateway:8080,service:80,database:5432,cache:6379,worker:0,custom:9092}[c.type]||80);
    if(c.type!=='worker' && (!Number.isInteger(Number(portValue)) || Number(portValue)<1 || Number(portValue)>65535)) issues.push(`组件「${c.name||i+1}」端口必须为 1-65535 的整数`);
    if(!Number.isInteger(Number(c.replicas||1)) || Number(c.replicas||1)<1 || Number(c.replicas||1)>100) issues.push(`组件「${c.name||i+1}」副本数必须为 1-100 的整数`);
    if((c.deps||[]).includes(i)) issues.push(`组件「${c.name}」不能依赖自身`);
    (c.deps||[]).forEach(d=>{if(!Number.isInteger(d)||d<0||d>=comps.length) issues.push(`组件「${c.name}」存在无效依赖`);});
  });
  const visiting=new Set(),visited=new Set(); let cycle=false;
  function dfs(i){if(visiting.has(i)){cycle=true;return;}if(visited.has(i))return;visiting.add(i);(comps[i].deps||[]).forEach(d=>{if(d>=0&&d<comps.length)dfs(d);});visiting.delete(i);visited.add(i);}
  comps.forEach((_,i)=>dfs(i)); if(cycle) issues.push('检测到循环依赖，请调整依赖关系');
  return [...new Set(issues)];
}
function cancelEditApp(){editingAppId=null;state.view='app';render();}
function getRecommendedWorkload(type){
  if (type === 'database' || type === 'cache') return 'StatefulSet';
  if (type === 'worker') return 'CronJob / Job';
  return 'Deployment';
}
function submitCreateApp(){
  const issues=validateDraft();
  if(issues.length) return alert('配置校验未通过：\n• '+issues.join('\n• '));
  if(!draftApp.name.trim()) return alert('请填写应用名称');
  const appId = editingAppId || ('app-' + Date.now());
  const previous = editingAppId ? getApp(editingAppId) : null;
  const componentIds = draftApp.components.map((c,i)=>c.sourceId || `c-${Date.now()}-${i}`);
  const removedComponentIds=previous?(previous.components||[]).map(c=>c.id).filter(id=>!componentIds.includes(id)):[];
  const referencedRoutes=previous?(previous.routes||[]).filter(route=>removedComponentIds.includes(route.targetId)):[];
  if(referencedRoutes.length)return alert(`无法移除组件：仍被 ${referencedRoutes.length} 条网关路由引用（${referencedRoutes.map(r=>r.name||r.id).join('、')}）。请先修改路由目标。`);
  const referencedRemoved=(window.TARGET_DEPLOYMENTS||[]).filter(d=>d.appId===appId&&removedComponentIds.includes(d.componentId));
  if(referencedRemoved.length&&isCapabilityEnabled('cloud-edge'))return alert(`无法移除组件：仍存在 ${referencedRemoved.length} 个云边目标部署。请先删除对应目标部署，或停用云边端协同后由核心编排自动清理扩展引用。`);
  const meshCapability=isCapabilityEnabled('service-mesh');
  const components = draftApp.components.map((c,i)=>{
    const old = previous?.components.find(x=>x.id===componentIds[i]);
    const type=c.type||'service', image=(c.image||'').trim();
    return {

function computeLayout(comps){
  const layer = {}; comps.forEach(c => layer[c.id] = 0);
  for(let i=0;i<comps.length+1;i++){
    let changed = false;
    comps.forEach(c => c.deps.forEach(d => { if(layer[d] !== undefined && layer[d] < layer[c.id] + 1){ layer[d] = layer[c.id] + 1; changed = true; } }));
    if(!changed) break;
  }
  const groups = {}; comps.forEach(c => { (groups[layer[c.id]] = groups[layer[c.id]] || []).push(c); });
  const pos = {}, COL = 258, ROW = 148, PAD = 260; // PAD 增大以容纳虚拟入口
  Object.keys(groups).sort((a,b)=>a-b).forEach(l => { groups[l].forEach((c,i) => { pos[c.id] = { x: PAD + l*COL, y: PAD + i*ROW }; }); });
  return pos;
}


function ensureGatewayData(app){

    let host='api.acme.io',path='/';

function gatewayValidation(app){

  if(!app.gatewayConfig.clusterIngressEnabled)out.push({level:'error',title:'集群入口已停用',detail:'外部请求可能无法到达应用。'});else out.push({level:'ok',title:'集群入口已启用',detail:'集群统一入口配置已打开。'});
  if(app.gatewayConfig.mode==='app-gateway'&&!app.gatewayConfig.appGatewayEnabled)out.push({level:'warn',title:'转发模式与网关状态不一致',detail:'应用网关未启用，将按直连模式处理。'});
  const enabled=app.routes.filter(r=>r.enabled);
  if(!enabled.length)out.push({level:'warn',title:'没有启用的路由',detail:'至少启用一条路由以接收请求。'});
  enabled.forEach(r=>{if(!app.components.some(c=>c.id===r.targetId))out.push({level:'error',title:`路由「${r.name}」目标无效`,detail:'请编辑路由并选择存在的后端组件。'});});
  const duplicate=new Set();enabled.forEach(r=>{const key=(r.host+'|'+r.path).toLowerCase();if(duplicate.has(key))out.push({level:'warn',title:'存在重复匹配规则',detail:`域名 ${r.host} 与路径 ${r.path} 重复。`});duplicate.add(key);});
  if(app.trafficPolicy.enabled&&app.trafficPolicy.canaryWeight>0)out.push({level:'ok',title:'灰度策略已配置',detail:`${100-app.trafficPolicy.canaryWeight}% 稳定流量，${app.trafficPolicy.canaryWeight}% 灰度流量。`});
  if(!out.length)out.push({level:'ok',title:'未发现明显问题',detail:'当前基础配置检查通过。'});return out;
}

function saveTrafficPolicy(){const app=selectedGatewayApp(),blocked=appConfigMutationReason(app,'保存流量策略');if(blocked)return alert(blocked);const enabled=document.getElementById('traffic-enabled').checked;const stableVersion=document.getElementById('stable-version').value.trim();const canaryVersion=document.getElementById('canary-version').value.trim();const canaryWeight=Number(document.getElementById('canary-weight').value);if(enabled&&(!stableVersion||!canaryVersion))return alert('请填写稳定版本和灰度版本');if(enabled&&stableVersion===canaryVersion)return alert('稳定版本和灰度版本不能相同');const validVersions=new Set(ensureReleaseData(app).map(r=>r.version));if(enabled&&(!validVersions.has(stableVersion)||!validVersions.has(canaryVersion)))return alert('稳定版本和灰度版本必须来自当前应用的发布记录。');app.trafficPolicy={enabled,stableVersion:stableVersion||app.version,canaryVersion:canaryVersion||nextPatchVersion(app.version),canaryWeight};app.updatedAt=new Date().toLocaleString();persistDemoState();alert('流量策略已保存（本地模拟）');render();}
function editGatewayRoute(routeId){const app=selectedGatewayApp(),blocked=appConfigMutationReason(app,'编辑网关路由');if(blocked)return alert(blocked);const old=app.routes.find(r=>r.id===routeId);state.editingRouteId=routeId||null;const r=old||{name:'',host:app.gatewayConfig.address||'api.acme.io',path:'/',method:'匹配所有',protocol:'HTTP',targetId:(app.components.find(c=>c.type==='service')||app.components.find(c=>c.type==='gateway')||app.components[0])?.id||'',enabled:true};const candidates=app.components.filter(c=>['service','gateway','custom'].includes(c.type));const options=candidates.map(c=>`<option value="${escapeHtml(c.id)}" ${c.id===r.targetId?'selected':''}>${escapeHtml(c.name)} (${escapeHtml(c.type)}:${c.port||'—'})</option>`).join('');
  showModal(`<div class="modal-head"><div><h2>${old?'编辑路由':'新增路由'}</h2><div class="sub">${escapeHtml(app.name)} · 配置请求匹配和后端转发</div></div><button class="modal-close" onclick="closeModal()">×</button></div><div class="form-group"><label>规则名称 *</label><input id="route-name" class="form-control" value="${escapeHtml(r.name)}" placeholder="例如：订单 API 路由" maxlength="80"></div><div class="form-group"><label>域名（Host）*</label><input id="route-host" class="form-control" value="${escapeHtml(r.host)}" placeholder="api.example.com"><div class="form-help">填写域名，不包含协议和路径。</div></div><div class="form-group"><label>路径匹配（Path）*</label><input id="route-path" class="form-control" value="${escapeHtml(r.path)}" placeholder="/api/v1"><div class="form-help">以 / 开头，例如 /api 或 /orders/{id}。</div></div><div class="form-group"><label>请求方法</label><select id="route-method" class="form-control">${['匹配所有','GET','POST','PUT','PATCH','DELETE'].map(m=>`<option ${m===(r.method||'匹配所有')?'selected':''}>${m}</option>`).join('')}</select></div><div class="form-group"><label>目标服务 *</label><select id="route-target" class="form-control">${options||'<option value="">暂无可用目标组件</option>'}</select></div><div class="form-group"><label>目标端口 *</label><input id="route-port" type="number" min="1" max="65535" class="form-control" value="${Number(r.targetPort)||app.components.find(c=>c.id===r.targetId)?.port||80}"></div><div class="form-group"><label><input type="checkbox" id="route-enabled" ${r.enabled!==false?'checked':''}> 启用此路由</label></div><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveGatewayRoute()">保存路由</button></div>`);
}
function saveGatewayRoute(){const app=selectedGatewayApp(),blocked=appConfigMutationReason(app,'保存网关路由');if(blocked)return alert(blocked);const name=document.getElementById('route-name').value.trim(),host=document.getElementById('route-host').value.trim().toLowerCase(),path=document.getElementById('route-path').value.trim(),method=document.getElementById('route-method').value,targetId=document.getElementById('route-target').value,port=Number(document.getElementById('route-port').value),enabled=document.getElementById('route-enabled').checked;
  if(!name)return alert('请填写规则名称');if(!host||host.includes('://')||host.includes('/')||/\s/.test(host))return alert('域名格式不正确，请只填写主机名');if(!path.startsWith('/'))return alert('路径必须以 / 开头');if(!targetId)return alert('请选择目标服务');if(!Number.isInteger(port)||port<1||port>65535)return alert('目标端口必须为 1-65535 的整数');
  const target=app.components.find(c=>c.id===targetId);if(!target)return alert('目标组件不存在，请重新选择。');if(Number(target.port)>0&&Number(target.port)!==port)return alert(`目标端口必须与组件「${target.name}」的服务端口 ${target.port} 一致。如需端口映射，请先建立独立 Service 模型。`);
  const dup=app.routes.find(r=>r.id!==state.editingRouteId&&r.enabled&&enabled&&r.host.toLowerCase()===host&&r.path===path&&r.method===method);if(dup&&!confirm('检测到相同域名、路径和方法的启用规则，仍要保存吗？'))return;
  const data={id:state.editingRouteId||'route-'+Date.now(),name,host,path,method,protocol:'HTTP',targetId,targetPort:port,enabled,createdAt:new Date().toLocaleString()};const index=app.routes.findIndex(r=>r.id===state.editingRouteId);if(index>=0)app.routes[index]=data;else app.routes.push(data);app.updatedAt=new Date().toLocaleString();persistDemoState();closeModal();render();}
function toggleGatewayRoute(routeId){const app=selectedGatewayApp(),blocked=appConfigMutationReason(app,'启停网关路由');if(blocked)return alert(blocked);const r=app.routes.find(x=>x.id===routeId);if(r){r.enabled=!r.enabled;app.updatedAt=new Date().toLocaleString();persistDemoState();render();}}
function deleteGatewayRoute(routeId){const app=selectedGatewayApp(),blocked=appConfigMutationReason(app,'删除网关路由');if(blocked)return alert(blocked);const r=app.routes.find(x=>x.id===routeId);if(!r)return;if(!confirm(`确定删除路由“${r.name}”吗？`))return;app.routes=app.routes.filter(x=>x.id!==routeId);app.updatedAt=new Date().toLocaleString();persistDemoState();render();}

function appOperationalSummaryHTML(app){
  const comps=app.components||[];
  const linked=comps.map(c=>({c,id:componentWorkloadIds(c)[0]||null,w:componentWorkloadIds(c)[0]?WORKLOADS[componentWorkloadIds(c)[0]]:null}));
  const workloads=linked.filter(x=>x.w);
  const ready=workloads.filter(x=>Number(x.w.ready)>=Number(x.w.replicas)&&x.w.health==='healthy'&&Number(x.w.replicas)>0).length;
  const readyRate=workloads.length?Math.round(ready/workloads.length*100):0;
  const pending=linked.filter(x=>{if(!x.c)return false;try{ensureRuntimeConfigVersions(x.c);return !!x.c.pendingConfig}catch(e){return false}});
  const latest=(app.releases||[]).slice().sort((a,b)=>String(b.startedAt||b.time||'').localeCompare(String(a.startedAt||a.time||'')))[0]||null;
  const inconsistent=app.versionConsistency?.status==='inconsistent'||app.deployStatus==='partial';
  const gatewayRevision=ensureGatewayRevision(app);
  const issues=[];
  linked.forEach(x=>{
    if(!x.w){issues.push({level:'warn',title:`组件「${x.c.name}」未关联有效工作负载`,detail:'检查主工作负载引用。',action:`openComponentFromList('${app.id}','${x.c.id}')`,label:'查看组件'});return;}
    if(Number(x.w.ready)<Number(x.w.replicas)||x.w.health!=='healthy')issues.push({level:'warn',title:`工作负载「${workloadDisplayName(x.id,x.w)}」未完全就绪`,detail:`就绪 ${Number(x.w.ready)||0}/${Number(x.w.replicas)||0} · 健康状态 ${x.w.health||'未知'}`,action:`openWorkloadFromList('${app.id}','${x.c.id}')`,label:'查看工作负载'});
    if(x.c.pendingConfig)issues.push({level:'warn',title:`组件「${x.c.name}」配置尚未生效`,detail:`期望 v${Number(x.c.configVersion)||1} · 已生效 ${x.c.appliedConfigVersion?'v'+x.c.appliedConfigVersion:'未记录'}`,action:`openComponentFromList('${app.id}','${x.c.id}')`,label:'查看配置'});
  });
  if(gatewayRevision?.pending)issues.push({level:'warn',title:'网关存在待发布配置',detail:'入口、路由或流量策略与当前已生效版本不一致。',action:`state.gatewayAppId='${app.id}';goNav('gateway')`,label:'查看网关'});
  if(inconsistent)issues.unshift({level:'error',title:'应用版本一致性校验未通过',detail:app.versionConsistency?.summary||'发布任务与应用整体运行状态不一致，请检查发布校验报告。',action:latest?`openReleaseTaskDetails('${latest.id}')`:`openReleaseHistory()`,label:latest?'查看发布校验':'查看发布记录'});
  if(latest&&['failed','partial','cancelled','paused'].includes(latest.status))issues.push({level:latest.status==='failed'?'error':'warn',title:`最近发布任务状态：${releaseStatusMeta(latest.status)[0]}`,detail:`版本 ${latest.version||'未命名'} · ${latest.error||latest.failureReason||'查看任务事件与目标状态定位原因。'}`,action:`openReleaseTaskDetails('${latest.id}')`,label:'查看发布任务'});
  const issuesHtml=issues.length?issues.slice(0,6).map(i=>`<div class="ops-issue"><span class="badge ${i.level==='error'?'red':'amber'}">${i.level==='error'?'异常':'待处理'}</span><div class="ops-issue-main"><b>${escapeHtml(i.title)}</b><div>${escapeHtml(i.detail)}</div></div><button class="btn sm" onclick="${i.action}">${i.label}</button></div>`).join(''):`<div class="validation-box success" style="margin:0">未发现明显运行异常：当前关联工作负载就绪，配置同步且最近发布未报告异常。</div>`;
  const configSynced=comps.length-pending.length;
  const consistencyLabel=inconsistent?'存在不一致':app.versionConsistency?.status==='consistent'?'校验一致':'尚未校验';
  const consistencyClass=inconsistent?'red':app.versionConsistency?.status==='consistent'?'green':'gray';
  return `<section class="ops-overview"><div class="ops-overview-head"><div><h2>应用运行态总览</h2><div class="form-help">汇总业务模型、工作负载就绪、配置同步与最近发布状态；点击异常项可跳转定位。</div></div><button class="btn sm" onclick="showBusinessModelAudit()">校验业务模型</button></div><div class="ops-metrics"><div class="ops-metric"><span>工作负载就绪率</span><b>${ready}/${workloads.length}</b><small>${workloads.length?readyRate+'%':'尚无关联工作负载'}</small></div><div class="ops-metric"><span>配置同步</span><b>${configSynced}/${comps.length}</b><small>${pending.length?pending.length+' 个组件待发布':'配置均已同步'}</small></div><div class="ops-metric"><span>应用当前版本</span><b>${escapeHtml(app.version||'未发布')}</b><small>任务状态不等于全局一致性</small></div><div class="ops-metric"><span>版本一致性</span><b><span class="badge ${consistencyClass}">${consistencyLabel}</span></b><small>${app.versionConsistency?.checkedAt?'校验于 '+escapeHtml(app.versionConsistency.checkedAt):'尚无最近校验时间'}</small></div></div><div class="ops-issues-head"><b>异常与待处理事项</b><span class="badge ${issues.some(i=>i.level==='error')?'red':issues.length?'amber':'green'}">${issues.length?issues.length+' 项':'正常'}</span></div><div class="ops-issues">${issuesHtml}</div>${latest?`<div class="ops-latest-release"><span>最近发布：<b>${escapeHtml(latest.version||latest.id)}</b> · ${escapeHtml(releaseStatusMeta(latest.status)[0])}</span><button class="btn sm" onclick="openReleaseTaskDetails('${latest.id}')">发布任务详情 →</button></div>`:''}</section>`;
}


function appTroubleshootingEvents(app){
  const out=[], comps=app.components||[];
  const push=(e)=>out.push({...e,time:e.time||e.timestamp||e.createdAt||'',level:e.level||'info',source:e.source||'应用',sourceType:e.sourceType||'lifecycle',componentId:e.componentId||'',actionType:e.actionType||'',actionId:e.actionId||'',detail:e.detail||''});
  comps.forEach(c=>{
    (c.configHistory||[]).forEach(h=>push({time:h.time,source:'配置变更',sourceType:'config',componentId:c.id,level:h.status==='pending'?'warning':'info',title:`${c.name} 配置版本 v${h.version}`,detail:(h.changes||[]).join('、')||`配置状态：${h.status||'历史'}`,actionType:'component'}));
    componentWorkloadIds(c).forEach(id=>{const w=WORKLOADS[id];if(!w)return;
      (w.events||[]).forEach(e=>push({time:e.time,source:'工作负载事件',sourceType:'workload',componentId:c.id,actionId:id,level:/warning|error|failed|unhealthy/i.test(`${e.type} ${e.reason}`)?'error':e.type==='Normal'?'info':'warning',title:e.reason||e.type||'工作负载事件',detail:e.msg||e.message||'',actionType:'workload'}));
      (w.history||[]).forEach(h=>push({time:h.time||h.startedAt,source:'工作负载变更',sourceType:'workload',componentId:c.id,actionId:id,level:h.status==='failed'?'error':'info',title:`${workloadDisplayName(id,w)} · ${h.action||h.type||h.status||'状态变更'}`,detail:h.detail||h.message||h.version||'',actionType:'workload'}));
    });
  });
  (app.releases||[]).forEach(r=>{
    push({time:r.startedAt||r.time,source:'发布任务',sourceType:'release',level:r.status==='failed'?'error':['paused','cancelled','partial'].includes(r.status)?'warning':'info',title:`发布 ${r.version||r.id} · ${releaseStatusMeta(r.status)[0]}`,detail:r.error||r.failureReason||`任务 ${r.id||''} · ${r.phase||'发布状态变更'}`,actionType:'release',actionId:r.id});
    (r.events||[]).forEach(e=>push({time:e.time||r.time,source:'发布事件',sourceType:'release',level:/warning|error/i.test(e.type||'')?'warning':'info',title:e.reason||'发布事件',detail:e.msg||'',actionType:'release',actionId:r.id}));
  });
  if(app.createdAt)push({time:app.createdAt,source:'应用生命周期',sourceType:'lifecycle',level:'info',title:'应用创建',detail:'应用基础信息已创建'});
  if(app.suspendedAt)push({time:app.suspendedAt,source:'应用生命周期',sourceType:'lifecycle',level:'warning',title:'应用停用',detail:'应用进入停用状态，工作负载副本数可能已缩容'});
  if(app.resumedAt)push({time:app.resumedAt,source:'应用生命周期',sourceType:'lifecycle',level:'info',title:'应用恢复',detail:'应用已请求恢复至停用前副本数'});
  return out.map((e,i)=>({...e,_key:`${e.sourceType}-${e.actionId}-${e.componentId}-${i}`,_ts:Date.parse(e.time)||0})).sort((a,b)=>(b._ts||-1)-(a._ts||-1));
}
function appIncidentAnalysisHTML(app){
  const incidents=[];
  (app.components||[]).forEach(c=>{
    const ids=componentWorkloadIds(c),ws=ids.map(id=>({id,w:WORKLOADS[id]})).filter(x=>x.w);
    const bad=ws.filter(x=>x.w.health!=='healthy'||Number(x.w.ready)<Number(x.w.replicas));
    const pending=!!c.pendingConfig;
    const releases=(app.releases||[]).filter(r=>!r.componentId||r.componentId===c.id).sort((a,b)=>String(b.startedAt||b.time||'').localeCompare(String(a.startedAt||a.time||'')));
    const failed=releases.find(r=>['failed','partial','paused','cancelled'].includes(r.status));
    if(bad.length){incidents.push({key:'workload',level:'error',component:c,title:`${c.name} 工作负载未完全就绪`,summary:`${bad.length} 个关联工作负载存在健康或副本就绪问题。`,evidence:[...bad.map(x=>`${workloadDisplayName(x.id,x.w)}：健康状态 ${x.w.health||'未知'}，就绪 ${x.w.ready??0}/${x.w.replicas??0}`),pending?'同时检测到配置待生效。':'',failed?`关联发布任务 ${failed.id} 状态为 ${releaseStatusMeta(failed.status)[0]}。`: ''].filter(Boolean),next:'先核对最近发布与工作负载事件，再确认探针、资源限制和期望副本数。'});}
    if(pending){incidents.push({key:'config',level:'warning',component:c,title:`${c.name} 存在未生效配置`,summary:'期望配置与已生效配置尚未同步。',evidence:[`期望配置版本：v${Number(c.configVersion)||1}`,`已生效配置版本：${c.appliedConfigVersion?'v'+c.appliedConfigVersion:'未记录'}`,failed?`近期异常发布：${failed.id}（${releaseStatusMeta(failed.status)[0]}）`:'未发现明确关联的异常发布任务'],next:'查看配置差异，确认变更是否需要重新发布；避免未核对差异就直接回退。'});}
  });
  const inconsistent=app.versionConsistency?.status==='inconsistent'||app.deployStatus==='partial';
  if(inconsistent)incidents.unshift({key:'consistency',level:'error',component:null,title:'应用版本一致性异常',summary:'发布任务结果与应用当前状态可能不一致。',evidence:[`应用版本：${app.version||'未记录'}`,`一致性校验：${app.versionConsistency?.summary||app.versionConsistency?.status||'尚无详细报告'}`,`部署状态：${app.deployStatus||'未记录'}`,...(app.releases||[]).slice().sort((a,b)=>String(b.startedAt||b.time||'').localeCompare(String(a.startedAt||a.time||''))).slice(0,2).map(r=>`发布 ${r.version||r.id}：${releaseStatusMeta(r.status)[0]}（${r.id}）`)],next:'先查看最近发布任务的目标快照、校验报告和流量状态，再决定是否恢复或重新发布。'});
  if(!incidents.length)return `<section class="incident-analysis panel"><div class="panel-head"><span>异常关联分析</span><span class="badge green">暂未发现明显关联异常</span></div><p class="form-help">系统根据模拟的工作负载就绪状态、配置同步状态与发布结果生成关联线索。新异常出现后，可在这里查看证据链和建议步骤。</p></section>`;
  return `<section class="incident-analysis panel"><div class="panel-head"><div><span>异常关联分析</span><div class="form-help">按组件聚合配置、发布与运行态线索；以下为排查方向，不等同于自动根因判定。</div></div><span class="badge ${incidents.some(x=>x.level==='error')?'red':'amber'}">${incidents.length} 条线索</span></div><div class="incident-cards">${incidents.slice(0,8).map((x,i)=>`<article class="incident-card"><div class="incident-card-top"><span class="badge ${x.level==='error'?'red':'amber'}">${x.level==='error'?'异常线索':'待核查'}</span><b>${escapeHtml(x.title)}</b></div><p>${escapeHtml(x.summary)}</p><div class="incident-evidence"><b>关联证据</b><ul>${x.evidence.slice(0,4).map(e=>`<li>${escapeHtml(e)}</li>`).join('')}</ul></div><div class="incident-next"><b>建议下一步：</b>${escapeHtml(x.next)}</div><div class="incident-actions"><button class="btn sm primary" onclick="openIncidentAnalysis('${app.id}','${x.component?.id||''}','${x.key}')">查看证据链与处理步骤</button>${x.component?`<button class="btn sm" onclick="openComponentFromList('${app.id}','${x.component.id}')">查看组件</button>`:''}</div></article>`).join('')}</div><div class="form-help">建议操作仅用于引导排查；回滚、重启、恢复流量等有影响的动作仍需在对应页面核对后手动确认。</div></section>`;
}
function openIncidentAnalysis(appId,compId,kind){
  const app=getApp(appId);if(!app)return;const c=(app.components||[]).find(x=>x.id===compId);const related=appTroubleshootingEvents(app).filter(e=>(!compId||e.componentId===compId)&&(kind==='consistency'||(kind==='config'?e.sourceType==='config':kind==='workload'?e.sourceType==='workload':true))).slice(0,8);
  const title=kind==='consistency'?'应用版本一致性异常':kind==='config'?'配置未生效排查':kind==='workload'?'工作负载异常排查':'异常关联分析';
  const steps=kind==='config'?['打开组件配置页，确认期望版本与已生效版本。','查看配置差异，识别是否包含环境变量、探针或资源变更。','核对变更后是否触发了对应发布；确认无误后再执行应用。','应用后检查工作负载就绪状态与配置同步标记。']:kind==='workload'?['先查看异常发生时间附近的工作负载事件和最近一次变更。','核对最近发布版本、镜像版本及发布任务健康门禁结果。','检查探针配置、容器日志线索、资源请求/限制和副本数。','确认根因后再选择重试、扩缩容或回滚，并验证就绪率恢复。']:['打开最近发布任务，检查目标快照、任务事件和校验结果。','比较发布前后应用版本、配置版本、工作负载就绪状态。','确认流量目标是否与预期版本一致，并检查是否存在部分成功。','确定恢复方案后在对应操作页显式确认，操作后重新运行一致性校验。'];

function nextPatchVersion(version){const m=String(version||'v1.0.0').match(/^v?(\d+)\.(\d+)\.(\d+)/);if(!m)return 'v1.0.1';return `v${m[1]}.${m[2]}.${Number(m[3])+1}`;}
function getReleaseWorkloadRows(app){
  const rows=[];(app.components||[]).forEach(c=>componentWorkloadIds(c).forEach(id=>{const w=WORKLOADS[id];if(w)rows.push({id,component:c,workload:w});}));
  // 云边目标实例由 TargetDeployment/协同发布管理，不混入应用级云发布目标。
  Object.entries(WORKLOADS).forEach(([id,w])=>{if(!rows.some(r=>r.id===id)&&w._ownerAppId===app.id&&!targetDeploymentForWorkload(id))rows.push({id,component:null,workload:w});});
  return rows;
}
function getSelectedReleaseTargetIds(){return [...document.querySelectorAll('input[name="release-target-workload"]:checked')].map(el=>el.value);}
function preflightReleaseTargets(app,targetIds,healthGate){
  const rows=getReleaseWorkloadRows(app),byId=new Map(rows.map(r=>[r.id,r])),issues=[],warnings=[],selected=new Set(targetIds);
  if(!targetIds.length)issues.push('至少选择一个目标工作负载');
  targetIds.forEach(id=>{const r=byId.get(id);if(!r){issues.push(`工作负载 ${id} 不存在`);return;}if(!r.workload.image||!String(r.workload.image).includes('/')||!/:([^/:]+)$/.test(r.workload.image))issues.push(`${workloadDisplayName(id,r.workload)}：当前镜像地址缺少完整路径或标签`);if(Number(r.workload.replicas)<1)issues.push(`${workloadDisplayName(id,r.workload)}：副本数为 0，无法通过健康门禁`);if(r.workload.health!=='healthy')warnings.push(`${workloadDisplayName(id,r.workload)}：当前健康状态为 ${r.workload.health||'unknown'}`);});
  const selectedComponents=new Set(targetIds.map(id=>byId.get(id)?.component?.id).filter(Boolean));
  targetIds.forEach(id=>{const r=byId.get(id),c=r?.component;if(!c)return;(c.deps||[]).forEach(depId=>{const dep=app.components.find(x=>x.id===depId);if(!dep){issues.push(`${c.name}：依赖组件 ${depId} 不存在`);return;}const depTargets=componentWorkloadIds(dep).map(wid=>byId.get(wid)).filter(Boolean);if(depTargets.some(x=>selected.has(x.id)))return;const healthy=depTargets.some(x=>x.workload.health==='healthy'&&Number(x.workload.ready)>=Number(x.workload.replicas));if(!healthy)issues.push(`${c.name}：依赖组件 ${dep.name} 未纳入本次发布，且没有健康的已运行工作负载`);});});
  // 组件级拓扑排序：先发布依赖组件，再发布依赖方；同组件内保持列表顺序。
  const compIds=[...new Set(targetIds.map(id=>byId.get(id)?.component?.id).filter(Boolean))],indeg=new Map(compIds.map(id=>[id,0])),edges=new Map(compIds.map(id=>[id,[]]));
  compIds.forEach(id=>{const c=app.components.find(x=>x.id===id);(c?.deps||[]).forEach(dep=>{if(indeg.has(dep)){edges.get(dep).push(id);indeg.set(id,indeg.get(id)+1);}});});
  const queue=compIds.filter(id=>indeg.get(id)===0),sorted=[];while(queue.length){const id=queue.shift();sorted.push(id);(edges.get(id)||[]).forEach(next=>{indeg.set(next,indeg.get(next)-1);if(indeg.get(next)===0)queue.push(next);});}
  if(sorted.length!==compIds.length)issues.push('检测到组件依赖循环，无法确定安全发布顺序');
  const order=sorted.flatMap(cid=>targetIds.filter(id=>byId.get(id)?.component?.id===cid));targetIds.filter(id=>!byId.get(id)?.component).forEach(id=>order.push(id));
  if(healthGate&&warnings.length)warnings.push('已启用健康门禁：模拟发布会在每个目标工作负载更新后检查就绪状态；当前异常目标会在预检查中重点提示。');
  return {issues,warnings,order,rows:targetIds.map(id=>byId.get(id)).filter(Boolean)};
}
function runReleasePreflight(){
  const app=getApp(state.appId);if(!app)return;const targetIds=getSelectedReleaseTargetIds(),healthGate=!!document.getElementById('release-health-gate')?.checked,res=preflightReleaseTargets(app,targetIds,healthGate),el=document.getElementById('release-preflight');if(!el)return;
  el.innerHTML=`<div class="validation-box ${res.issues.length?'error':res.warnings.length?'warn':'success'}"><b>${res.issues.length?'预检查未通过':res.warnings.length?'预检查通过，但存在提醒':'预检查通过'}</b>${res.issues.length?`<ul>${res.issues.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>`:''}${res.warnings.length?`<ul>${res.warnings.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>`:''}<div style="margin-top:8px"><b>建议发布顺序：</b>${res.order.map(id=>escapeHtml(workloadDisplayName(id,WORKLOADS[id]))).join(' → ')||'—'}</div><div class="form-help">目标资源 ${res.rows.length} 个 · 本次检查不会修改运行状态</div></div>`;
}
function openPublishModal(preferredWorkloadId=null){
  const app=getApp(state.appId); if(!app)return;
  if(!Array.isArray(app.components)||app.components.length===0)return alert('空应用暂不可发布。请先添加至少一个业务组件，再创建或关联主工作负载。');
  const publishable=getReleaseWorkloadRows(app);if(!publishable.length)return alert('当前应用尚无可发布的工作负载。请先为组件创建或关联主工作负载。');

  app.gatewayRevision={version,status:'applied',pending:false,resourceVersion:(Number(app.gatewayRevision?.resourceVersion)||1)+1,releaseId:`rollback-${version}-${Date.now()}`,updatedAt:time};
  const trafficAfter=getReleaseTrafficBaseline(app),afterSnapshot=captureReleaseSnapshot(app,version);
  releases.forEach(r=>r.current=false);
  const rollback={version,status:'success',strategy:'回滚',notes:`回滚到 ${version}${restored?'（恢复镜像与运行配置，并创建新的已生效配置版本）':'（旧记录无完整快照，仅恢复可识别的镜像版本）'}`,time,operator:app.owner||'当前用户',current:true,snapshot:afterSnapshot,restoredSnapshot:restored,versionBefore,versionAfter:version,trafficBefore,trafficAfter,beforeSnapshot,afterSnapshot,targetReleaseId:target.id||null,events:[{type:'Normal',time,reason:'RollbackSnapshotRestored',msg:`从 ${versionBefore||'未知版本'} 回滚到 ${version}，稳定路由恢复为 ${version} 100%，临时发布流量已清除`}]};
  rollback.runtimeVersion=[...new Set(Object.values(afterSnapshot.workloads||{}).map(w=>imageVersionTag(w.image)).filter(Boolean))];
  releases.unshift(rollback);
  recordReleaseEvent(target,'Normal','RollbackRequested',`使用版本 ${version} 的发布前快照创建独立回滚任务`);
  persistDemoState();persistConfigAssets();closeModal();render();
}
function showModal(content){let root=document.getElementById('modal-root');if(!root){root=document.createElement('div');root.id='modal-root';document.body.appendChild(root);}root.innerHTML=`<div class="modal-mask" onclick="if(event.target===this)closeModal()"><div class="modal-card">${content}</div></div>`;}
function closeModal(){if(activeModal==='runtime-config-preview'){cancelRuntimeConfigPreview();return;}if(activeModal==='runtime-config'&&runtimeConfigDirty&&!confirm('当前配置尚未保存，确定放弃本次修改吗？'))return;const root=document.getElementById('modal-root');if(root)root.innerHTML='';activeModal=null;if(!stagedRuntimeConfig)runtimeConfigDirty=false;}
function markRuntimeConfigDirty(){if(activeModal==='runtime-config')runtimeConfigDirty=true;}

function inspectorHTML(){

        <div class="row-actions" style="margin-top:10px"><button class="btn" onclick="openRuntimeConfig()">编辑运行配置</button><button class="btn primary" onclick="openWorkload()">查看工作负载详情 →</button></div>
      </div>`;
  }

  return `<div class="inspector-head">
      <button class="btn-collapse" onclick="toggleInspector()">${ico.close}</button>
