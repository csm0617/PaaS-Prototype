        <div class="gateway-context-item"><span>配置版本</span><b>v${Number(revision.resourceVersion)||1}</b><small>${revision.pending?'等待应用发布校验':'已由发布任务应用'}</small></div>
      </div>
      ${revision.pending?'<div class="validation-box warn" style="margin-bottom:14px"><b>网关存在待发布变更</b><div class="form-help">当前展示期望配置，只有发布校验通过后才会更新为已生效版本。</div></div>':''}
      <div class="gateway-workbench">
        <aside class="gateway-route-panel"><div class="gateway-route-panel-head"><div><h2>路由规则</h2><p>${routes.length} 条规则 · 按 Host、Path 和方法匹配</p></div><button class="btn sm primary" onclick="editGatewayRoute()">新增</button></div><div class="gateway-route-list">${routeList}</div></aside>
        <section class="gateway-detail-panel">
          <div class="gateway-detail-head"><div class="gateway-detail-title"><h2>${route?escapeHtml(route.name||'未命名路由'):'路由详情'}</h2><p>${route?`${escapeHtml(route.host||'未配置 Host')}${escapeHtml(route.path||'/')} · ${routeTarget?escapeHtml(routeTarget.name):'目标服务不存在'}`:'从左侧选择路由后查看详情'}</p></div><div class="gateway-detail-actions">${route?`<span class="badge ${route.enabled?'green':'gray'}">${route.enabled?'已启用':'已停用'}</span><button class="btn sm" onclick="editGatewayRoute('${escapeHtml(route.id)}')">编辑</button><button class="btn sm" onclick="toggleGatewayRoute('${escapeHtml(route.id)}')">${route.enabled?'停用':'启用'}</button><button class="btn sm danger" onclick="deleteGatewayRoute('${escapeHtml(route.id)}')">删除</button>`:''}</div></div>
          <div class="gateway-detail-tabs"><button type="button" class="gateway-detail-tab ${tab==='route'?'active':''}" onclick="setGatewayWorkspaceTab('route')">路由详情</button><button type="button" class="gateway-detail-tab ${tab==='traffic'?'active':''}" onclick="setGatewayWorkspaceTab('traffic')">灰度流量</button><button type="button" class="gateway-detail-tab ${tab==='checks'?'active':''}" onclick="setGatewayWorkspaceTab('checks')">配置检查</button></div>
          <div class="gateway-detail-content">${detailContent}</div>
        </section>
      </div>
    </div>`;
  }

  const originalSaveGatewayRoute=window.saveGatewayRoute;
  if(typeof originalSaveGatewayRoute==='function')window.saveGatewayRoute=function(){
    const app=selectedGatewayApp(),beforeIds=new Set((app?.routes||[]).map(route=>route.id)),editingId=state.editingRouteId,result=originalSaveGatewayRoute.apply(this,arguments);
    const selected=editingId?app?.routes.find(route=>route.id===editingId):app?.routes.find(route=>!beforeIds.has(route.id));
    state.editingRouteId=null;
    if(selected){state.gatewayRouteId=selected.id;state.gatewayTab='route';render();}
    return result;
  };
  const originalDeleteGatewayRoute=window.deleteGatewayRoute;
  if(typeof originalDeleteGatewayRoute==='function')window.deleteGatewayRoute=function(routeId){
    const app=selectedGatewayApp(),result=originalDeleteGatewayRoute.apply(this,arguments);
    if(app&&!app.routes.some(route=>route.id===routeId)){state.gatewayRouteId=app.routes[0]?.id||null;state.gatewayTab='route';render();}
    return result;
  };

  window.viewGateway=viewGatewayWorkbench;
  window.selectedGatewayRoute=selectedGatewayRoute;
  window.selectGatewayRoute=selectGatewayRoute;
  window.setGatewayWorkspaceTab=setGatewayWorkspaceTab;
  window.setGatewayApplication=setGatewayApplication;
})();
</script>

<script>
/* Unified terminal access gateway: simulated by default, WebSocket-ready interface. */
(function(){
  const domain=window.CloudForgeTerminalDomain;
  const STORAGE_KEY='cloudforge-terminal-sessions-v1';
  let TERMINAL_SESSIONS=[];
  let terminalLoginTarget=null;
  let terminalActiveSessionId=null;

  function persistTerminalSessions(){
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:1,sessions:TERMINAL_SESSIONS}));}catch(error){console.warn('Terminal session persistence failed.',error);}
  }
  function loadTerminalSessions(){
    try{
      const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
      TERMINAL_SESSIONS=Array.isArray(saved?.sessions)?saved.sessions:Array.isArray(saved)?saved:[];
      let changed=false;
      TERMINAL_SESSIONS.forEach(session=>{
        if(session.status==='active'&&domain.isTerminalSessionExpired(session,new Date().toISOString(),session.lastActivityAt)){domain.transitionTerminalSession(session,'expired',{reason:'session expired while browser was closed'});changed=true;}
        if(session.status==='awaiting_approval'&&new Date(session.expiresAt).getTime()<=Date.now()){domain.transitionTerminalSession(session,'denied',{reason:'approval window expired'});changed=true;}
      });
      if(changed)persistTerminalSessions();
    }catch(error){console.warn('Terminal session restore failed.',error);TERMINAL_SESSIONS=[];}
  }
  function getSession(id){return TERMINAL_SESSIONS.find(session=>session.id===id)||null;}
  function targetForWorkload(workloadId,podIndex=0){
    const workload=WORKLOADS[workloadId],link=componentForWorkload(workloadId),app=link?.app||getApp(workload?._ownerAppId),component=link?.component;
    const pod=workload?.pods?.[Number(podIndex)||0]||workload?.pods?.[0]||null;
    const namespace=app?.mesh?.namespace||app?.namespace||(app?`${app.id}-default`:'default');
    return {
      type:'pod',id:pod?`${workloadId}/${pod.name}`:workloadId,name:pod?.name||workloadDisplayName(workloadId,workload||{}),
      available:!!pod&&pod.status==='Running',podName:pod?.name||'',podIndex:Number(podIndex)||0,node:pod?.node||'',
      workloadId,appId:app?.id||workload?._ownerAppId||null,componentId:component?.id||null,namespace,
      containerName:component?.name||'app',version:imageVersionTag(workload?.image)||'unknown',
      contextLabel:`${app?.name||'独立资源'} / ${component?.name||workloadDisplayName(workloadId,workload||{})}`
    };
  }
  function targetForEdgeNode(nodeId){
    const node=EDGE_NODES.find(item=>item.id===nodeId);
    const deployment=TARGET_DEPLOYMENTS.find(item=>item.targetId===nodeId);
    return node?{
      type:'edge-node',id:node.id,name:node.name,available:node.status==='online',status:node.status,
      site:node.site,region:node.region,agentVersion:node.version,syncSequence:Number(node.syncSequence)||0,
      desiredVersion:deployment?.desiredVersion||'',observedVersion:deployment?.observedVersion||'',
      contextLabel:`${node.site} / ${node.region}`
    }:null;
  }
  function targetForCloudNode(nodeName){
    const node=CLUSTER_NODES.find(item=>item.name===nodeName);
    return node?{
      type:'cloud-node',id:node.name,name:node.name,available:node.status==='Ready',status:node.status,
      ip:node.ip,role:node.role,contextLabel:`${node.role} / ${node.ip}`
    }:null;
  }
  function createSession(target,options={}){
    const actor=String(options.actor||'张明').trim(),role=options.role||'operator',reason=String(options.reason||'').trim();
    if(!target)return {ok:false,access:{allowed:false,reason:'terminal target does not exist'}};
    const access=domain.evaluateTerminalAccess({role,target,reason});
    if(Number(options.ttlSeconds)>0)access.ttlSeconds=Math.max(60,Math.min(3600,Number(options.ttlSeconds)));
    const duplicate=TERMINAL_SESSIONS.find(session=>session.actor===actor&&session.target?.type===target.type&&session.target?.id===target.id&&['active','awaiting_approval'].includes(session.status));
    if(duplicate)return {ok:true,duplicate:true,access,session:duplicate};
    const session=domain.createTerminalSession({actor,role,reason,target,access});
    TERMINAL_SESSIONS.unshift(session);
    persistTerminalSessions();
    return {ok:access.allowed,access,session};
  }
  function approveSession(id,options={}){
    const session=getSession(id);
    if(!session)return {ok:false,error:'session not found'};
    if(session.status!=='awaiting_approval')return {ok:false,error:'session is not awaiting approval',session};
    if(options.role!=='admin')return {ok:false,error:'admin role is required',session};
    const result=domain.transitionTerminalSession(session,'active',{actor:options.actor||'管理员',approvedBy:options.actor||'管理员',reason:options.reason||'approved by administrator',result:'approved'});
    if(result.ok)persistTerminalSessions();
    return {...result,ok:result.ok,session,error:result.ok?null:'state transition denied'};
  }
  function endSession(id,reason='user ended terminal session'){
    const session=getSession(id);
    if(!session)return {ok:false,error:'session not found'};
    const targetStatus=session.status==='awaiting_approval'?'denied':'ended';
    const result=domain.transitionTerminalSession(session,targetStatus,{reason,result:targetStatus});
    if(result.ok)persistTerminalSessions();
    return {...result,session,ok:result.ok};
  }
  function terminateSession(id,reason='administrator terminated terminal session'){
    const session=getSession(id);if(!session)return {ok:false,error:'session not found'};
    const result=domain.transitionTerminalSession(session,'terminated',{actor:'管理员',reason,result:'terminated'});
    if(result.ok)persistTerminalSessions();
    return {...result,session,ok:result.ok};
  }
  function terminalTargetAvailability(target){
    if(target?.type==='pod'){
      const workload=WORKLOADS[target.workloadId];
      const pod=workload?.pods?.find(item=>item.name===target.podName)||workload?.pods?.[Number(target.podIndex)||0];
      return {available:!!pod&&pod.status==='Running',reason:pod?'pod is not running':'pod no longer exists'};
    }
    if(target?.type==='edge-node'){
      const node=EDGE_NODES.find(item=>item.id===target.id);
      return {available:node?.status==='online',reason:node?'edge node is offline':'edge node no longer exists'};
    }
    if(target?.type==='cloud-node'){
      const node=CLUSTER_NODES.find(item=>item.name===target.id);
      return {available:node?.status==='Ready',reason:node?'cloud node is not Ready':'cloud node no longer exists'};
    }
    return {available:false,reason:'unsupported terminal target'};
  }
  const simulatedGateway=Object.freeze({
    mode:'simulation',
    send(sessionId,command){
      const session=getSession(sessionId);
      if(!session)return {ok:false,blocked:true,output:'Session not found.\n',exitCode:1,session:null};
      const availability=terminalTargetAvailability(session.target);
      if(session.status==='active'&&!availability.available){
        const now=new Date().toISOString();
        const audit=domain.createTerminalAudit(session,'command',{now,command:String(command||''),risk:'safe',result:'target-unavailable',exitCode:126});
        session.lastActivityAt=now;
        session.commands=session.commands||[];
        session.commands.push({command:String(command||''),risk:'safe',result:'target-unavailable',exitCode:126,blocked:true,time:now});
        session.recording=session.recording||[];
        session.recording.push({time:now,type:'command',command:String(command||''),output:'',blocked:true,exitCode:126});
        session.audit=session.audit||[];
        session.audit.push(audit);
        persistTerminalSessions();
        return {ok:false,blocked:true,output:`Terminal target unavailable: ${availability.reason}.\n`,exitCode:126,result:'target-unavailable',audit,session};
      }
      const result=domain.runSimulatedCommand({session,command,now:new Date().toISOString()});
      persistTerminalSessions();
      return {...result,ok:!result.blocked,session};
    },
    close(sessionId,reason){return endSession(sessionId,reason);},
    resize(){return true;}
  });
  function createWebSocketTerminalGateway(options={}){
    const endpoint=String(options.endpoint||'').trim();
    return {
      mode:'websocket',
      endpoint,
      open(session){if(!endpoint)return {ok:false,error:'WebSocket terminal endpoint is not configured',session};return {ok:false,error:'WebSocket terminal adapter is not connected in this prototype',session};},
      send(sessionId){return {ok:false,blocked:true,output:'WebSocket terminal gateway is not connected.\n',exitCode:1,session:getSession(sessionId)};},
      resize(){return false;},
      close(sessionId,reason){return endSession(sessionId,reason);}
    };
  }

  function terminalStateBadge(status){
    const meta={requested:['已请求','gray'],awaiting_approval:['等待审批','amber'],active:['会话中','green'],ended:['已结束','gray'],terminated:['已终止','red'],expired:['已过期','amber'],denied:['已拒绝','red']}[status]||[status||'未知','gray'];
    return `<span class="badge ${meta[1]}">${escapeHtml(meta[0])}</span>`;
  }
  function terminalTargetLabel(target){
    const type={pod:'Pod', 'edge-node':'边缘节点','cloud-node':'云主机'}[target?.type]||'终端目标';
    return `${type} · ${target?.name||target?.id||'未知目标'}`;
  }
  function openLogin(target){
    if(!target)return alert('终端目标不存在。');
    terminalLoginTarget=target;
    const roleOptions=domain.TERMINAL_ROLES.map(role=>`<option value="${role}" ${role==='operator'?'selected':''}>${role==='viewer'?'只读用户':role==='operator'?'运维人员':'管理员'}</option>`).join('');
    showModal(`<div class="modal-head"><div><h2>终端登录</h2><div class="sub">${escapeHtml(terminalTargetLabel(target))}</div></div><button class="modal-close" onclick="closeModal()">×</button></div>
      <div class="terminal-target-card"><b>${escapeHtml(terminalTargetLabel(target))}</b><div class="muted">${escapeHtml(target.contextLabel||target.namespace||target.ip||target.site||'')}</div><code>${escapeHtml(target.id)}</code>${target.type==='pod'?`<div class="muted">Pod ${escapeHtml(target.podName||'—')} · 容器 ${escapeHtml(target.containerName||'app')} · 命名空间 ${escapeHtml(target.namespace||'default')}</div>`:''}${target.type==='edge-node'?`<div class="muted">Agent ${escapeHtml(target.agentVersion||'—')} · 状态 ${escapeHtml(target.status||'unknown')}</div>`:''}${target.type==='cloud-node'?`<div class="muted">主机 ${escapeHtml(target.ip||'—')} · 状态 ${escapeHtml(target.status||'unknown')}</div>`:''}</div>
      <div class="terminal-meta-grid"><div class="form-group"><label>操作者</label><input id="terminal-actor" class="form-control" value="张明"></div><div class="form-group"><label>角色</label><select id="terminal-role" class="form-control">${roleOptions}</select></div><div class="form-group"><label>会话时长</label><select id="terminal-ttl" class="form-control"><option value="300">5 分钟</option><option value="900" selected>15 分钟</option><option value="1800">30 分钟</option></select></div></div>
      <div class="form-group"><label>登录原因 <span style="color:var(--red)">*</span></label><textarea id="terminal-reason" class="form-control" rows="2" placeholder="例如：排查 Pod 启动失败、确认边缘 Agent 同步状态"></textarea></div>
      <div class="validation-box warn">${target.type==='cloud-node'?'云主机终端具有较高权限；operator 角色需要管理员审批。':'终端操作会记录会话、命令、退出码与风险等级。原型仅执行本地模拟命令。'}</div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="submitTerminalLogin()">登录终端</button></div>`);
  }
  function submitTerminalLogin(){
    const target=terminalLoginTarget;
    const actor=document.getElementById('terminal-actor')?.value.trim()||'张明';
    const role=document.getElementById('terminal-role')?.value||'operator';
    const reason=document.getElementById('terminal-reason')?.value.trim()||'';
    const ttlSeconds=Number(document.getElementById('terminal-ttl')?.value)||900;
    const result=createSession(target,{actor,role,reason,ttlSeconds});
    if(!result.ok){
      showModal(`<div class="modal-head"><div><h2>终端登录被拒绝</h2><div class="sub">${escapeHtml(terminalTargetLabel(target))}</div></div><button class="modal-close" onclick="closeModal()">×</button></div><div class="validation-box warn">${escapeHtml(result.access?.reason||'访问策略拒绝登录')}</div><div class="modal-actions"><button class="btn" onclick="openLogin(${JSON.stringify(target).replace(/"/g,'&quot;')})">返回修改</button><button class="btn primary" onclick="closeModal()">关闭</button></div>`);
      return result;
    }
    openTerminalWindow(result.session.id);
    return result;
  }
  function openTerminalWindow(sessionId){
    const session=getSession(sessionId);if(!session)return alert('终端会话不存在。');
    terminalActiveSessionId=session.id;
    if(session.status==='awaiting_approval'){
      showModal(`<div class="modal-head"><div><h2>等待管理员审批</h2><div class="sub">${escapeHtml(terminalTargetLabel(session.target))}</div></div><button class="modal-close" onclick="closeModal()">×</button></div><div class="validation-box warn">operator 登录云主机需要管理员审批。审批通过后会话才会激活。会话到期时间：${escapeHtml(session.expiresAt)}</div><div class="modal-actions"><button class="btn" onclick="endTerminalSession('${session.id}','approval cancelled')">取消申请</button><button class="btn primary" onclick="approveTerminalSession('${session.id}')">模拟管理员审批</button></div>`);
      return;
    }
    if(session.status!=='active'){
      showTerminalSessionDetails(session.id);
      return;
    }
    const prior=(session.recording||[]).map(item=>`$ ${item.command}\n${item.output||''}`).join('');
    const banner=`CloudForge Terminal Gateway · ${terminalTargetLabel(session.target)}\nSession ${session.id} · ${session.actor} (${session.role}) · simulated mode\nExpires ${session.expiresAt}\nType help for available commands.\n\n`;
    showModal(`<div class="modal-head"><div><h2>终端会话</h2><div class="sub">${escapeHtml(terminalTargetLabel(session.target))} · ${escapeHtml(session.role)}</div></div><button class="modal-close" onclick="closeModal()">×</button></div>
      <div class="terminal-shell"><div class="terminal-bar"><b>${escapeHtml(session.target.name||session.target.id)}</b><span>${terminalStateBadge(session.status)} · ${escapeHtml(session.actor)} · ${escapeHtml(session.id)}</span></div><pre id="terminal-output" class="terminal-output">${escapeHtml(banner+prior)}</pre><form class="terminal-command-row" onsubmit="event.preventDefault();runTerminalCommand('${session.id}')"><span class="terminal-prompt">$</span><input id="terminal-command-input" autocomplete="off" spellcheck="false" placeholder="输入命令，例如 help、ps、cat /app/version"><button class="btn primary" type="submit">执行</button></form></div>
      <div class="validation-box warn" style="margin-top:12px">危险命令会被策略阻断并写入审计。真实环境应使用后端短期凭证、WebSocket 网关和会话录制。</div><div class="modal-actions"><button class="btn" onclick="endTerminalSession('${session.id}','user closed terminal')">结束会话</button><button class="btn" onclick="showTerminalSessionDetails('${session.id}')">查看审计</button><button class="btn primary" onclick="closeModal()">后台保留</button></div>`);
    setTimeout(()=>document.getElementById('terminal-command-input')?.focus(),0);
  }
  function appendTerminalOutput(text){
    const output=document.getElementById('terminal-output');if(!output)return;
    output.textContent+=String(text||'');output.scrollTop=output.scrollHeight;
  }
  function runTerminalCommand(sessionId){
    const session=getSession(sessionId),input=document.getElementById('terminal-command-input');
    if(!session||!input)return {ok:false};
    const command=input.value.trim();if(!command)return {ok:false};
    appendTerminalOutput(`$ ${command}\n`);
    const result=simulatedGateway.send(sessionId,command);
    input.value='';
    if(result.output)appendTerminalOutput(result.output);
    if(command==='exit'){endSession(sessionId,'exit command');appendTerminalOutput('Session ended.\n');input.disabled=true;}
    else if(result.blocked)appendTerminalOutput(`[exit ${Number(result.exitCode)||126}]\n`);
    input.focus();
    return result;
  }
  function endTerminalSession(sessionId,reason='user ended terminal session'){
    const result=endSession(sessionId,reason);terminalActiveSessionId=null;openTerminalWindow(sessionId);render();return result;
  }
  function terminateTerminalSession(sessionId,reason='administrator terminated session'){
    const result=terminateSession(sessionId,reason);terminalActiveSessionId=null;openTerminalWindow(sessionId);render();return result;
  }
  function approveTerminalSession(sessionId){
    const result=approveSession(sessionId,{actor:'张明',role:'admin',reason:'simulated administrator approval'});
    if(!result.ok)return alert(result.error||'审批失败');
    openTerminalWindow(sessionId);persistTerminalSessions();render();return result;
  }
  function showTerminalSessionDetails(sessionId){
    const session=getSession(sessionId);if(!session)return;
    const commands=(session.commands||[]).map(item=>`<div class="terminal-session-command"><b>${escapeHtml(item.command||'')}</b> · ${escapeHtml(item.risk||'safe')} · exit ${Number(item.exitCode)||0} · ${escapeHtml(item.result||'')}<div class="muted">${escapeHtml(item.time||'')}</div></div>`).join('');
    const audit=(session.audit||[]).slice(-20).reverse().map(item=>`<div class="tl-item"><div class="tl-time">${escapeHtml(item.time||'—')}</div><div class="tl-body"><div class="r">${escapeHtml(item.action||'audit')} · ${escapeHtml(item.result||'recorded')}</div><div class="m">${escapeHtml(item.reason||item.command||'')}</div></div></div>`).join('');
    showModal(`<div class="modal-head"><div><h2>终端会话审计</h2><div class="sub">${escapeHtml(terminalTargetLabel(session.target))}</div></div><button class="modal-close" onclick="closeModal()">×</button></div><div class="terminal-meta-grid"><div><span>状态</span><b>${terminalStateBadge(session.status)}</b></div><div><span>操作者</span><b>${escapeHtml(session.actor)} / ${escapeHtml(session.role)}</b></div><div><span>命令数</span><b>${(session.commands||[]).length}</b></div><div><span>开始时间</span><b>${escapeHtml(session.startedAt||session.requestedAt||'—')}</b></div><div><span>到期时间</span><b>${escapeHtml(session.expiresAt||'—')}</b></div><div><span>结束时间</span><b>${escapeHtml(session.endedAt||'—')}</b></div></div><div class="section-title">登录原因</div><div class="validation-box">${escapeHtml(session.reason||'—')}</div><div class="section-title">命令记录</div><div style="max-height:220px;overflow:auto">${commands||'<div class="empty">暂无命令</div>'}</div><div class="section-title">会话审计</div><div class="timeline" style="max-height:220px;overflow:auto">${audit||'<div class="empty">暂无审计</div>'}</div><div class="modal-actions"><button class="btn" onclick="closeModal()">关闭</button>${session.status==='active'?`<button class="btn primary" onclick="openTerminalWindow('${session.id}')">返回终端</button>`:''}${['active','awaiting_approval'].includes(session.status)?`<button class="btn danger" onclick="terminateTerminalSession('${session.id}','administrator terminated session')">强制终止</button>`:''}</div>`);
  }
  function viewTerminalSessions(){
    const active=TERMINAL_SESSIONS.filter(item=>item.status==='active').length,awaiting=TERMINAL_SESSIONS.filter(item=>item.status==='awaiting_approval').length,ended=TERMINAL_SESSIONS.filter(item=>['ended','terminated','expired','denied'].includes(item.status)).length,blocked=TERMINAL_SESSIONS.reduce((sum,item)=>sum+(item.commands||[]).filter(command=>command.blocked).length,0);
    const rows=TERMINAL_SESSIONS.map(session=>`<tr><td><b>${escapeHtml(terminalTargetLabel(session.target))}</b><div class="muted mono">${escapeHtml(session.target?.id||'')}</div></td><td>${escapeHtml(session.actor)}<div class="muted">${escapeHtml(session.role)}</div></td><td>${terminalStateBadge(session.status)}</td><td>${(session.commands||[]).length}</td><td>${(session.commands||[]).filter(item=>item.blocked).length}</td><td>${escapeHtml(session.requestedAt||'—')}<div class="muted">${escapeHtml(session.reason||'')}</div></td><td><div class="row-actions">${session.status==='active'?`<button class="btn sm primary" onclick="openTerminalWindow('${session.id}')">继续会话</button>`:''}${session.status==='awaiting_approval'?`<button class="btn sm primary" onclick="approveTerminalSession('${session.id}')">审批登录</button>`:''}<button class="btn sm" onclick="showTerminalSessionDetails('${session.id}')">审计</button>${['active','awaiting_approval'].includes(session.status)?`<button class="btn sm danger" onclick="terminateTerminalSession('${session.id}','session terminated from terminal center')">终止</button>`:''}</div></td></tr>`).join('');
    return `<div class="page"><div class="page-head"><div><h1>终端会话</h1><div class="sub">统一管理 Pod、边缘节点和云主机登录权限、审批、命令录制与审计</div></div><button class="btn" onclick="openTerminalTargetPicker()">新建终端登录</button></div><div class="resource-stats"><div class="resource-stat"><div class="label">活动会话</div><div class="value" style="color:var(--green)">${active}</div><div class="hint">当前可交互终端</div></div><div class="resource-stat"><div class="label">等待审批</div><div class="value" style="color:var(--amber)">${awaiting}</div><div class="hint">高权限登录申请</div></div><div class="resource-stat"><div class="label">历史会话</div><div class="value">${ended}</div><div class="hint">已结束、终止或拒绝</div></div><div class="resource-stat"><div class="label">阻断命令</div><div class="value" style="color:${blocked?'var(--red)':'var(--green)'}">${blocked}</div><div class="hint">危险操作审计</div></div></div><table class="card"><thead><tr><th style="width:23%">目标</th><th style="width:13%">操作者</th><th style="width:11%">状态</th><th style="width:8%">命令</th><th style="width:8%">阻断</th><th style="width:22%">请求 / 原因</th><th style="width:15%">操作</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">暂无终端会话</td></tr>'}</tbody></table><div class="persist-note">会话、命令和审批记录保存在当前浏览器；真实环境应由后端终端网关控制临时凭证和会话录制。</div></div>`;
  }
  function openTerminalTargetPicker(){
    const pods=[];Object.entries(WORKLOADS).forEach(([id,workload])=>(workload.pods||[]).slice(0,2).forEach((pod,index)=>pods.push({label:`Pod · ${pod.name}`,target:targetForWorkload(id,index)})));
    const edges=EDGE_NODES.map(node=>({label:`边缘 · ${node.name}`,target:targetForEdgeNode(node.id)}));
    const clouds=CLUSTER_NODES.map(node=>({label:`云主机 · ${node.name}`,target:targetForCloudNode(node.name)}));
    const items=[...pods,...edges,...clouds].slice(0,30).map(item=>`<button class="select-resource-item" onclick='openLogin(${JSON.stringify(item.target).replace(/'/g,"&#39;")})'><span><b>${escapeHtml(item.label)}</b><small>${escapeHtml(item.target.contextLabel||item.target.id)}</small></span><span class="badge ${item.target.available?'green':'amber'}">${item.target.available?'可登录':'不可用'}</span></button>`).join('');
    showModal(`<div class="modal-head"><div><h2>选择终端目标</h2><div class="sub">Pod、边缘节点与云主机统一登录入口</div></div><button class="modal-close" onclick="closeModal()">×</button></div><div class="select-resource-list" style="max-height:58vh;overflow:auto">${items||'<div class="empty">暂无可用终端目标</div>'}</div><div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button></div>`);
  }
  function openPodTerminalForCurrent(){
    const ctx=getActiveWorkloadContext();if(!ctx)return alert('未找到工作负载。');
    const podIndex=(ctx.workload?.pods||[]).findIndex(pod=>pod.status==='Running');
    if(podIndex<0)return alert('该工作负载当前没有 Running 状态的 Pod，无法登录终端。');
    openLogin(targetForWorkload(ctx.workloadId,podIndex));
  }
  function openPodTerminal(workloadId,podIndex=0){openLogin(targetForWorkload(workloadId,podIndex));}
  function openEdgeTerminal(nodeId){openLogin(targetForEdgeNode(nodeId));}
  function openCloudNodeTerminal(nodeName){openLogin(targetForCloudNode(nodeName));}
  function decorateTerminalEntryPoints(){
    const main=document.getElementById('main');if(!main)return;
    if(state.view==='workload'&&!document.getElementById('terminal-workload-entry')){
      const actions=main.querySelector('.app-actions');
      if(actions){const button=document.createElement('button');button.id='terminal-workload-entry';button.className='btn';button.textContent='Pod 终端';button.setAttribute('onclick','openPodTerminalForCurrent()');actions.insertBefore(button,actions.firstChild);}
    }
    if(state.view==='cluster'){
      const table=main.querySelector('table');const headRow=table?.querySelector('thead tr');
      if(table&&headRow&&!headRow.querySelector('[data-terminal-column]')){
        const lastHeader=headRow.lastElementChild;if(lastHeader)lastHeader.style.width='6%';
        const th=document.createElement('th');th.dataset.terminalColumn='1';th.style.width='6%';th.textContent='终端';headRow.appendChild(th);
        [...table.querySelectorAll('tbody tr')].forEach(row=>{
          const name=row.querySelector('td b')?.textContent?.trim();const td=document.createElement('td');td.dataset.terminalColumn='1';
          const button=document.createElement('button');button.className='btn sm';button.textContent='SSH 登录';button.onclick=event=>{event.stopPropagation();openCloudNodeTerminal(name);};td.appendChild(button);row.appendChild(td);
        });
      }
    }
  }

  loadTerminalSessions();
  const originalOpenPodDetail=window.openPodDetail;
  if(typeof originalOpenPodDetail==='function')window.openPodDetail=function(index){
    const result=originalOpenPodDetail.apply(this,arguments);
    const root=document.getElementById('modal-root'),ctx=getActiveWorkloadContext(),actions=root?.querySelector('.modal-actions');
    if(ctx&&actions&&!root.querySelector('[data-terminal-pod-entry]')){const button=document.createElement('button');button.className='btn primary';button.dataset.terminalPodEntry='1';button.textContent='终端登录';button.onclick=()=>openLogin(targetForWorkload(ctx.workloadId,index));actions.insertBefore(button,actions.firstChild);}
    return result;
  };
  const originalEdgeFocus=window.edgeFocusNode;
  if(typeof originalEdgeFocus==='function')window.edgeFocusNode=function(id){
    const result=originalEdgeFocus.apply(this,arguments);
    const root=document.getElementById('modal-root'),actions=root?.querySelector('.modal-actions');
    if(actions&&!root.querySelector('[data-terminal-edge-entry]')){const button=document.createElement('button');button.className='btn';button.dataset.terminalEdgeEntry='1';button.textContent='Agent 终端';button.setAttribute('onclick',`openEdgeTerminal('${id}')`);actions.insertBefore(button,actions.firstChild);}
    return result;
  };

  window.CloudForgeTerminalApp=Object.freeze({
    get sessions(){return TERMINAL_SESSIONS.slice();},
    targetForWorkload,
    targetForEdgeNode,
    targetForCloudNode,
    createSession,
    approveSession,
    getSession,
    runCommand:(sessionId,command)=>simulatedGateway.send(sessionId,command),
    endSession,
    terminateSession,
    openLogin,
    openTerminalWindow,
    openPodTerminal,
    openEdgeTerminal,
    openCloudNodeTerminal
  });
  window.CloudForgeTerminalGatewayFactories=Object.freeze({simulation:()=>simulatedGateway,websocket:createWebSocketTerminalGateway});
  window.CloudForgeTerminalSessions=TERMINAL_SESSIONS;
  window.viewTerminalSessions=viewTerminalSessions;
  window.decorateTerminalEntryPoints=decorateTerminalEntryPoints;
  window.openLogin=openLogin;
  window.submitTerminalLogin=submitTerminalLogin;
  window.openTerminalWindow=openTerminalWindow;
  window.runTerminalCommand=runTerminalCommand;
  window.endTerminalSession=endTerminalSession;
  window.terminateTerminalSession=terminateTerminalSession;
  window.approveTerminalSession=approveTerminalSession;
  window.showTerminalSessionDetails=showTerminalSessionDetails;
  window.openTerminalTargetPicker=openTerminalTargetPicker;
  window.openPodTerminalForCurrent=openPodTerminalForCurrent;
  window.openPodTerminal=openPodTerminal;
  window.openEdgeTerminal=openEdgeTerminal;
  window.openCloudNodeTerminal=openCloudNodeTerminal;
})();
</script>

</body>
