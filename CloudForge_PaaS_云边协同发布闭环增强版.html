function viewWorkload(){
  const ctx=getActiveWorkloadContext();
  if(!ctx) return `<div class="page"><div class="empty">未找到工作负载 <button class="btn" onclick="goNav('workloads')">返回列表</button></div></div>`;
  const meshCapability=isCapabilityEnabled('service-mesh');
  const app=ctx.app||{id:'standalone',name:'独立资源',namespace:'default',components:[],mesh:{}};
  const c=ctx.component,w=ctx.workload,workloadId=ctx.workloadId;
  const workloadName=workloadDisplayName(workloadId,w);
  const siblingWorkloads=ctx.linked?getComponentWorkloads(c):[];
  const workloadSwitcher=siblingWorkloads.length>1?`<div class="panel" style="margin-bottom:14px"><div class="panel-head"><span>该组件关联的工作负载</span><span class="hint">${siblingWorkloads.length} 个独立运行资源</span></div><div style="display:flex;gap:8px;flex-wrap:wrap;padding:12px">${siblingWorkloads.map(item=>`<button class="btn ${item.id===workloadId?'primary':''}" onclick="openWorkloadResource('${item.id}')"><span>${escapeHtml(workloadDisplayName(item.id,item.workload))}</span><span class="badge ${item.workload.health==='healthy'?'green':'amber'}">${Number(item.workload.ready)||0}/${Number(item.workload.replicas)||0}</span></button>`).join('')}</div></div>`:'';
  w.pods = Array.isArray(w.pods) ? w.pods : [];
  w.events = Array.isArray(w.events) ? w.events : [];
  const runningPods = w.pods.filter(p=>p.status==='Running').length;
  const restartingPods = w.pods.filter(p=>(Number(p.restarts)||0)>0).length;
  const readyPct = w.replicas ? Math.round((w.ready/w.replicas)*100) : 0;
  const namespace = app.mesh?.namespace || app.namespace || `${app.id}-default`;
  const podRows = w.pods.map((p,i) => {
    const cls = p.status === 'Running' || p.status === 'Completed' ? 'green' : p.status === 'Pending' ? 'amber' : 'red';
    return `<tr class="pod-row" onclick="openPodDetail(${i})" title="点击查看 Pod 详情"><td><a class="mono" onclick="event.stopPropagation();openPodDetail(${i})">${escapeHtml(p.name)}</a><div class="muted">${escapeHtml(namespace)}</div></td><td><span class="badge ${cls}"><i class="dot ${cls}"></i>${escapeHtml(p.status)}</span></td><td class="mono">${escapeHtml(p.node||'—')}</td><td>${Number(p.restarts)||0}${Number(p.restarts)>0?'<span class="badge amber" style="margin-left:5px">需关注</span>':''}</td><td class="mono">${escapeHtml(p.cpu||'—')}</td><td class="mono">${escapeHtml(p.mem||'—')}</td><td style="color:var(--text2)">${escapeHtml(p.age||'—')}</td><td><button class="btn sm" onclick="event.stopPropagation();openWorkloadLogs(${i})">日志</button></td></tr>`;
  }).join('');
  const eventItems = w.events.length ? w.events.map(e => {
    const cls = e.type === 'Warning' ? 'amber' : 'green';
    return `<div class="tl-item"><div class="tl-time">${escapeHtml(e.time||'—')}</div><div class="tl-body"><div class="r"><span class="badge ${cls}" style="padding:1px 7px;font-size:11px">${escapeHtml(e.type||'Normal')}</span><span style="margin-left:6px">${escapeHtml(e.reason||'Event')}</span></div><div class="m">${escapeHtml(e.msg||'')}</div></div></div>`;
  }).join('') : '<div class="empty">暂无事件。执行扩缩容、重启或滚动更新后，操作事件会显示在这里。</div>';
  const healthText = w.health==='healthy' ? '健康' : w.health==='degraded' ? '降级' : '异常';
  const conditionRows = [
    ['期望副本满足度', Number(w.ready)>=Number(w.replicas), `期望 ${Number(w.replicas)||0} 个，当前就绪 ${Number(w.ready)||0} 个`],
    ['Pod 运行状态', runningPods===w.pods.length && w.pods.length>0, `${runningPods} / ${w.pods.length} 个 Pod Running`],
    ['重启情况', restartingPods===0, restartingPods ? `${restartingPods} 个 Pod 存在重启记录` : '未发现重启记录'],
    ['服务网格代理', !meshCapability || !w.sidecar?.injected || !!w.sidecar?.proxy, !meshCapability ? '服务网格能力未启用，当前使用核心运行模式' : w.sidecar?.injected ? `已注入 ${w.sidecar.proxy||'Envoy'}` : '未启用 Sidecar']
  ];
  return `
  <div class="page">
    <div class="crumbs" style="margin-bottom:14px"><a onclick="goNav('workloads')">工作负载</a><span>/</span>${ctx.linked?`<a onclick="backToApp()">${escapeHtml(app.name)}</a><span>/</span>`:''}<b>${escapeHtml(workloadName)}</b></div>
    <div class="page-head">
      <div><h1>${escapeHtml(workloadName)} <span style="font-size:14px;color:var(--text2);font-weight:400">· ${escapeHtml(w.type)}</span></h1><div class="sub">独立运行时资源 · ${ctx.linked?`所属应用 <b>${escapeHtml(app.name)}</b> / 组件 <b>${escapeHtml(c.name)}</b>`:'<b>尚未关联组件</b>'} · 命名空间 <b>${escapeHtml(namespace)}</b> · ${meshCapability?`Sidecar ${w.sidecar?.injected?'已注入':'未注入'}`:'核心运行模式'} · 镜像 <span class="mono">${escapeHtml(w.image||'—')}</span></div></div>
      <div class="app-actions">${statusBadge(w.health)}<button class="btn" onclick="openWorkloadLogs()">查看日志</button><button class="btn" onclick="openWorkloadEvents()">查看事件</button>${ctx.linked?'<button class="btn" onclick="openRuntimeConfig()">组件运行配置</button>':''}<button class="btn" onclick="openScaleModal()" ${app.lifecycleState==='suspended'?'disabled title="应用已停用，请先恢复"':''}>调整副本</button><button class="btn" onclick="restartWorkload()" ${app.lifecycleState==='suspended'?'disabled title="应用已停用，请先恢复"':''}>重启工作负载</button><button class="btn primary" onclick="rolloutWorkload()" ${app.lifecycleState==='suspended'?'disabled title="应用已停用，请先恢复"':''}>${ctx.linked?'进入应用发布':'切换镜像 / 发布'}</button>${ctx.linked?'':`<button class="btn danger" onclick="deleteWorkloadResource('${workloadId}')">删除资源</button>`}</div>
    </div>
    ${workloadSwitcher}
    <div class="wl-grid">
      <div class="stat"><div class="label">就绪副本 / 期望副本</div><div class="value">${Number(w.ready)||0}<small> / ${Number(w.replicas)||0}</small></div><div class="wl-progress"><span style="width:${Math.max(0,Math.min(100,readyPct))}%;background:${readyPct===100?'var(--green)':readyPct>0?'var(--amber)':'var(--red)'}"></span></div></div>
      <div class="stat"><div class="label">Pod 运行中</div><div class="value">${runningPods}<small> / ${w.pods.length}</small></div><div class="stat-note">${restartingPods?`${restartingPods} 个 Pod 有重启记录`:'暂无重启异常'}</div></div>
      <div class="stat"><div class="label">CPU 请求 / 限制</div><div class="value mono" style="font-size:15px">${escapeHtml(w.cpu||'未配置')}</div><div class="stat-note">内存：${escapeHtml(w.mem||'未配置')}</div></div>
      <div class="stat"><div class="label">控制器 / 更新策略</div><div class="value" style="font-size:16px">${escapeHtml(w.type)}</div><div class="stat-note">${escapeHtml(w.strategy||'默认策略')} · 状态${healthText} · ${ctx.linked?(c.pendingConfig?'配置待发布':'配置已同步'):'独立资源'}</div></div>
    </div>
    <div class="panel"><div class="panel-head"><span>Pod 列表</span><span class="hint">${w.pods.length} 个 Pod · 点击行查看详情</span></div>
      <div class="table-scroll"><table><thead><tr><th>Pod 名称 / 命名空间</th><th>状态</th><th>调度节点</th><th>重启次数</th><th>CPU</th><th>内存</th><th>运行时长</th><th>操作</th></tr></thead><tbody>${podRows||'<tr><td colspan="8" class="empty">暂无 Pod。请检查期望副本数及调度状态。</td></tr>'}</tbody></table></div>
    </div>
    <div class="panel"><div class="panel-head"><span>运行条件与诊断</span><span class="hint">基于当前模拟运行时状态</span></div><div class="condition-grid">${conditionRows.map(([label,ok,detail])=>`<div class="condition-item"><div class="condition-icon ${ok?'ok':'bad'}">${ok?'✓':'!'}</div><div><b>${label}</b><div class="condition-detail">${escapeHtml(detail)}</div></div><span class="badge ${ok?'green':'amber'}">${ok?'正常':'需关注'}</span></div>`).join('')}</div><div class="diagnostic-foot">提示：以上诊断为原型中的模拟信息，不代表真实 Kubernetes 探针、调度器或容器运行时检查结果。</div></div>
    <div class="panel"><div class="panel-head"><span>事件时间线</span><button class="btn sm" onclick="openWorkloadEvents()">查看全部</button></div><div class="timeline">${eventItems}</div></div>
  </div>`;
}

    <div class="modal-actions"><button class="btn" onclick="closeModal()">关闭</button><button class="btn primary" onclick="closeModal();openWorkloadLogs(${index})">查看容器日志</button></div>`);

function openWorkloadLogs(podIndex=null){
  const ctx=getActiveWorkloadContext(),app=ctx?.app||{id:'standalone',name:'独立资源',namespace:'default',mesh:{}},c=ctx?.component,w=ctx?.workload;if(!w||!c)return;
  const pod=Number.isInteger(podIndex)?w.pods?.[podIndex]:null;
  const podName=pod?.name||'全部 Pod';
  const logs=[
    {t:'2026-10-21T10:42:18.422Z',level:'INFO',msg:'Application started; readiness check passed'},
    {t:'2026-10-21T10:42:19.016Z',level:'INFO',msg:`Listening on port ${c.port||8080}`},
    {t:'2026-10-21T10:42:25.183Z',level:'INFO',msg:'Configuration loaded successfully'},
    {t:'2026-10-21T10:43:01.709Z',level:'WARN',msg:'Upstream request latency exceeded 500ms'},
    {t:'2026-10-21T10:43:02.021Z',level:'INFO',msg:'Request completed status=200 duration=518ms'},
    ...(isCapabilityEnabled('service-mesh')&&w.sidecar?.injected?[{t:'2026-10-21T10:43:03.100Z',level:'INFO',msg:'envoy proxy: outbound connection established'}]:[])
  ];
  showModal(`<div class="modal-head"><div><h2>容器日志</h2><div class="sub">${escapeHtml(c.name)} · ${escapeHtml(podName)}</div></div><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="log-toolbar"><select id="log-level-filter" class="form-control" onchange="filterMockLogs()"><option value="ALL">全部级别</option><option value="INFO">INFO</option><option value="WARN">WARN</option><option value="ERROR">ERROR</option></select><input id="log-search" class="form-control" placeholder="搜索日志关键字…" oninput="filterMockLogs()"><button class="btn" onclick="copyMockLogs()">复制日志</button></div>
    <div id="mock-log-output" class="log-output">${logs.map(l=>`<div class="log-line" data-level="${l.level}" data-search="${escapeHtml((l.t+' '+l.level+' '+l.msg).toLowerCase())}"><span class="log-time">${l.t}</span><span class="log-level ${l.level.toLowerCase()}">${l.level}</span><span>${escapeHtml(l.msg)}</span></div>`).join('')}</div>

// 绘制边缘线（处理虚拟入口点）
function drawEdges(){
  const app = getApp(state.appId);
  if(app) ensureGatewayData(app);
  const runtimeGatewayConfig=app?.gatewayApplied?.config||app?.gatewayConfig;
  const svg = document.getElementById('edges');
  if(!svg || !app) return;
  const pos = {};
  document.querySelectorAll('.node').forEach(n => { pos[n.dataset.id] = { x: parseFloat(n.style.left), y: parseFloat(n.style.top), w: n.offsetWidth, h: n.offsetHeight }; });
  
  let paths = '';
  
  // 1. 画组件之间的依赖线
  app.components.forEach(c => {
    (c.deps || []).forEach(d => {
      const a = pos[c.id], b = pos[d];
      if(!a || !b) return;
      const x1 = a.x + a.w, y1 = a.y + a.h/2, x2 = b.x - 8, y2 = b.y + b.h/2, mx = (x1 + x2) / 2;
      const rel = state.compId && (c.id === state.compId || d === state.compId);
      let weight = 100; if(isCapabilityEnabled('service-mesh')&&c.mesh?.route?.subsets?.length) weight = c.mesh.route.subsets.reduce((s,x)=>s+x.weight,0)/c.mesh.route.subsets.length;
      const strokeW = Math.max(1, Math.min(4, weight/35));
      const target = c.workload.health, color = target === 'healthy' ? '#9aa8c8' : target === 'degraded' ? '#e8a33d' : '#e5484d';
      const stroke = rel ? '#7c5cbf' : color, marker = rel ? 'arrow-mesh' : target === 'degraded' ? 'arrow-amber' : target === 'down' ? 'arrow-red' : 'arrow-gray';
      paths += `<path class="edge" data-from="${c.id}" data-to="${d}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" stroke="${stroke}" stroke-width="${rel?2.4:strokeW}" marker-end="url(#${marker})" opacity="${rel?1:.85}"/>`;
    });
  });

  // 2. 画从“集群入口网关”到第一层组件的线
  const entryDom = document.querySelector('.node-entry');
  if (entryDom) {
    const ex = parseFloat(entryDom.style.left) + entryDom.offsetWidth;
    const ey = parseFloat(entryDom.style.top) + entryDom.offsetHeight/2;
    
    const entryNodes = runtimeGatewayConfig?.appGatewayEnabled ? app.components.filter(c => c.type === 'gateway') : [];
    const finalEntryNodes = entryNodes.length > 0 ? entryNodes : app.components.filter(c => c.type === 'service');

    finalEntryNodes.forEach(c => {
      const b = pos[c.id];
      if (!b) return;
      const x2 = b.x - 8, y2 = b.y + b.h/2;
      const mx = (ex + x2) / 2;
      paths += `<path class="edge" d="M${ex},${ey} C${mx},${ey} ${mx},${y2} ${x2},${y2}" stroke="#4257d8" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-entry)" opacity="0.8"/>`;
    });
  }

  svg.innerHTML = `
    <defs>
      <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa8c8"/></marker>
      <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a33d"/></marker>
      <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5484d"/></marker>
      <marker id="arrow-mesh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c5cbf"/></marker>
      <marker id="arrow-entry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4257d8"/></marker>
    </defs>${paths}`;
}

  const mount=document.querySelector('#main .edge-console');if(!mount)return;
  const deployments=[...(window.TARGET_DEPLOYMENTS||[])];
  const consistent=deployments.filter(item=>(item.reconcileStatus||(item.desiredVersion===item.observedVersion?'consistent':'drift'))==='consistent').length;
  const drift=deployments.filter(item=>['drift','missing'].includes(item.reconcileStatus||(item.desiredVersion===item.observedVersion?'consistent':'drift'))).length;
  const degraded=deployments.filter(item=>(item.reconcileStatus||'')==='degraded').length;
  const activeReleases=(window.EDGE_RELEASES||[]).filter(item=>!['success','cancelled','rolled_back','partially_rolled_back'].includes(edgeReleaseStateKey(item))).length;
  const auditCount=(window.EDGE_RELEASES||[]).reduce((sum,item)=>sum+(Array.isArray(item.audit)?item.audit.length:0),0)+(window.EDGE_NODES||[]).reduce((sum,item)=>sum+(Array.isArray(item.audit)?item.audit.length:0),0);
  const offline=(window.EDGE_NODES||[]).filter(item=>item.status==='offline').length;
  const lastReconciled=deployments.map(item=>item.reconciledAt).filter(Boolean).sort().pop();
  const strip=document.createElement('section');
  strip.className='edge-closure-strip';
  strip.innerHTML=`<div class="edge-closure-metric"><span>版本对账</span><b>${consistent}/${deployments.length}</b><small>${drift?`${drift} 个漂移/缺失`:degraded?`${degraded} 个离线或降级`:'期望版本与运行版本一致'}</small></div><div class="edge-closure-metric"><span>活动发布</span><b>${activeReleases}</b><small>等待目标、执行、暂停和回滚均纳入同一状态机</small></div><div class="edge-closure-metric"><span>边缘自治</span><b>${offline}</b><small>离线节点保留云端期望态与最后一次实际态</small></div><div class="edge-closure-metric"><span>结构化审计</span><b>${auditCount}</b><small>${lastReconciled?'最近对账 '+escapeHtml(new Date(lastReconciled).toLocaleString()):'尚无对账记录'}</small></div>`;
  const tabs=mount.querySelector('.edge-tabs');
  if(tabs)tabs.parentNode.insertBefore(strip,tabs);else mount.prepend(strip);
}

function edgeToggleNode(id){
  if(!isCapabilityEnabled('cloud-edge'))return alert('云边端协同能力未启用。');
  const n=EDGE_NODES.find(x=>x.id===id);if(!n)return;
  const wasOffline=n.status==='offline';
  n.status=wasOffline?'online':'offline';
  n.mode=n.status==='online'?'在线同步':'断网自治';
  n.lastSync=n.status==='online'?'刚刚':n.lastSync;
  if(n.status==='online'){n.cpu=Math.max(15,n.cpu||32);n.memory=Math.max(25,n.memory||40);}else{n.cpu=0;n.memory=0;}
  TARGET_DEPLOYMENTS.filter(d=>d.targetId===id).forEach(d=>{
    if(n.status==='offline'){d.reconcileStatus='degraded';d.reconciledAt=new Date().toISOString();}
    d.status=n.status==='online'&&d.reconcileStatus==='consistent'?'healthy':'degraded';
    d.updatedAt=new Date().toLocaleString();
    upsertTargetDeploymentWorkload(d);
  });
  if(wasOffline)reconcileEdgeNodeState(id,{reason:'节点重连自动对账',from:'offline'});
  persistEdgeState();persistDemoState();render();
}

function backToApp(){ state.view = 'app'; state.tab = 'workload'; render(); }

<script id="terminal-domain-core">
/* Framework-free terminal access and session policy shared by UI and tests. */
(function(root){
  const TERMINAL_STATES=Object.freeze(['requested','awaiting_approval','active','ended','terminated','expired','denied']);
  const TERMINAL_TRANSITIONS=Object.freeze({
    requested:['active','awaiting_approval','denied'],
    awaiting_approval:['active','denied'],
    active:['ended','terminated','expired'],
    ended:[],
    terminated:[],
    expired:[],
    denied:[]
  });
  const TERMINAL_ROLES=Object.freeze(['viewer','operator','admin']);
  const DEFAULT_TTL_SECONDS=900;
  const DEFAULT_IDLE_TIMEOUT_SECONDS=300;
  const clone=value=>value===undefined?undefined:JSON.parse(JSON.stringify(value));
  const randomId=()=>`term-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;
  const isoAt=(value,offsetSeconds=0)=>new Date(new Date(value).getTime()+offsetSeconds*1000).toISOString();
  const normalize=value=>String(value??'').trim();

  function canTerminalTransition(from,to){
    return from===to || (TERMINAL_TRANSITIONS[from]||[]).includes(to);
  }
  function evaluateTerminalAccess({role='viewer',target={},reason=''}={}){
    const normalizedRole=TERMINAL_ROLES.includes(role)?role:'viewer';
    const normalizedTarget=clone(target||{});
    const normalizedReason=normalize(reason);
    if(!normalizedReason){
      return {allowed:false,initialStatus:'denied',approvalRequired:false,reason:'terminal access reason is required',ttlSeconds:DEFAULT_TTL_SECONDS,idleTimeoutSeconds:DEFAULT_IDLE_TIMEOUT_SECONDS};
    }
    if(normalizedRole==='viewer'){
      return {allowed:false,initialStatus:'denied',approvalRequired:false,reason:'viewer role cannot open terminal sessions',ttlSeconds:DEFAULT_TTL_SECONDS,idleTimeoutSeconds:DEFAULT_IDLE_TIMEOUT_SECONDS};
    }
    if(!['pod','edge-node','cloud-node'].includes(normalizedTarget.type)){
      return {allowed:false,initialStatus:'denied',approvalRequired:false,reason:'unsupported terminal target type',ttlSeconds:DEFAULT_TTL_SECONDS,idleTimeoutSeconds:DEFAULT_IDLE_TIMEOUT_SECONDS};
    }
    if(normalizedTarget.available===false){
      return {allowed:false,initialStatus:'denied',approvalRequired:false,reason:'terminal target is unavailable',ttlSeconds:DEFAULT_TTL_SECONDS,idleTimeoutSeconds:DEFAULT_IDLE_TIMEOUT_SECONDS};
    }
    const approvalRequired=normalizedRole==='operator'&&normalizedTarget.type==='cloud-node';
    return {
      allowed:true,
      initialStatus:approvalRequired?'awaiting_approval':'active',
      approvalRequired,
      reason:approvalRequired?'operator cloud-node access requires approval':'terminal access granted',
      ttlSeconds:DEFAULT_TTL_SECONDS,
      idleTimeoutSeconds:DEFAULT_IDLE_TIMEOUT_SECONDS
    };
  }
  function createTerminalAudit(session,action,options={}){
    return {
      id:`taudit-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`,
      time:options.now||new Date().toISOString(),
      sessionId:session?.id||null,
      action,
      from:options.from??null,
      to:options.to??null,
      actor:session?.actor||options.actor||'当前用户',
      role:session?.role||options.role||'viewer',
      target:clone(session?.target||options.target||null),
      command:options.command||null,
      risk:options.risk||null,
      result:options.result||'recorded',
      exitCode:options.exitCode??null,
      reason:options.reason||null
    };
  }
  function createTerminalSession({id,actor,role,reason,target,access,now}={}){
    const accessResult=access||evaluateTerminalAccess({role,target,reason});
    const timestamp=now||new Date().toISOString();
    const session={
      id:id||randomId(),
      actor:actor||'当前用户',
      role:role||'viewer',
      reason:normalize(reason),
      target:clone(target||{}),
      status:accessResult.initialStatus,
      requestedAt:timestamp,
      approvedAt:null,
      approvedBy:null,
      startedAt:accessResult.initialStatus==='active'?timestamp:null,
      expiresAt:isoAt(timestamp,accessResult.ttlSeconds||DEFAULT_TTL_SECONDS),
      endedAt:null,
      ttlSeconds:accessResult.ttlSeconds||DEFAULT_TTL_SECONDS,
      idleTimeoutSeconds:accessResult.idleTimeoutSeconds||DEFAULT_IDLE_TIMEOUT_SECONDS,
      commands:[],
      recording:[],
      audit:[]
    };
    session.audit.push(createTerminalAudit(session,'session-opened',{now:timestamp,to:session.status,result:accessResult.allowed?'accepted':'denied',reason:accessResult.reason}));
    return session;
  }
  function transitionTerminalSession(session,to,options={}){
    const from=session?.status||'requested';
    if(!session||!canTerminalTransition(from,to)){
      return {ok:false,session,from,to,audit:createTerminalAudit(session,'transition-blocked',{...options,from,to,result:'denied'})};
    }
    session.status=to;
    if(to==='active'){
      session.startedAt=session.startedAt||options.now||new Date().toISOString();
      session.approvedAt=options.now||new Date().toISOString();
      session.approvedBy=options.approvedBy||options.actor||'system-policy';
    }
    if(['ended','terminated','expired','denied'].includes(to)){
      session.endedAt=options.now||new Date().toISOString();
    }
    const audit=createTerminalAudit(session,'session-state-changed',{...options,from,to,result:options.result||'accepted'});
    session.audit=session.audit||[];
    session.audit.push(audit);
    return {ok:true,session,from,to,audit};
  }
  function classifyTerminalCommand(command){
    const value=normalize(command);
    const rules=[
      [/rm\s+-rf\s+\/(?:\s|$)/i,'recursive root filesystem deletion'],
      [/mkfs(?:\.\w+)?\s+/i,'filesystem formatting'],
      [/\bdd\s+if=.*\bof=\/dev\//i,'block-device write'],
      [/\b(?:shutdown|reboot|poweroff|halt)\b/i,'host power operation'],
      [/\bkubectl\s+(?:delete\s+(?:node|namespace)|drain)\b/i,'cluster-wide destructive operation'],
      [/:\(\)\s*\{\s*:\|:&\s*\}\s*;:/,'fork bomb']
    ];
    const matched=rules.find(([pattern])=>pattern.test(value));
    return matched?{risk:'blocked',allowed:false,reason:matched[1]}:{risk:'safe',allowed:true,reason:'command allowed'};
  }
  function isTerminalSessionExpired(session,now=new Date().toISOString(),lastActivityAt=null){
    if(!session||session.status!=='active')return true;
    const nowMs=new Date(now).getTime();
    if(Number.isFinite(new Date(session.expiresAt).getTime())&&nowMs>=new Date(session.expiresAt).getTime())return true;
    const activity=lastActivityAt||session.lastActivityAt||session.startedAt||session.requestedAt;
    return Number.isFinite(new Date(activity).getTime())&&nowMs-new Date(activity).getTime()>=Number(session.idleTimeoutSeconds||DEFAULT_IDLE_TIMEOUT_SECONDS)*1000;
  }
  function maskSensitiveOutput(value){
    return String(value??'').replace(/\b([A-Z0-9_]*(?:PASSWORD|SECRET|TOKEN|API_KEY|ACCESS_KEY)[A-Z0-9_]*\s*=\s*)[^\s]+/gi,'$1[REDACTED]');
  }
  function runSimulatedCommand({session,command,now=new Date().toISOString()}={}){
    const value=normalize(command);
    const classification=classifyTerminalCommand(value);
    const expired=isTerminalSessionExpired(session,now,session?.lastActivityAt);
    let blocked=expired||!session||session.status!=='active'||!classification.allowed;
    let exitCode=blocked?(expired?125:126):0;
    let output='';
    let result=expired?'expired':classification.allowed?'success':'blocked';
    if(expired){
      output='Session expired. Open a new terminal session.\n';
    }else if(!classification.allowed){
      output=`Command blocked by terminal policy: ${classification.reason}.\n`;
    }else if(!value||value==='help'){
      output='Simulated terminal commands: whoami, pwd, ls, date, cat /app/version, ps, uptime, exit\n';
    }else if(value==='whoami'){
      output=`${session.actor}\n`;
    }else if(value==='pwd'){
      output=session.target.type==='pod'?'/app\n':'/home/cloudforge\n';
    }else if(value==='ls'){
      output='app  config  logs  tmp\n';
    }else if(value==='date'){
      output=`${new Date(now).toISOString()}\n`;
    }else if(value==='cat /app/version'){
      output=`${session.target.version||'unknown'}\n`;
    }else if(value==='ps'){
      output='PID TTY          TIME CMD\n  1 ?        00:00:03 cloudforge-app\n';
    }else if(value==='edge-agent status'){
      output=`edge-agent: ${session.target.available===false?'offline':'online'} · ${session.target.id}\n`;
    }else if(value==='sync status'){
      output=`sequence=${Number(session.target.syncSequence)||0} desired=${session.target.desiredVersion||'unknown'} observed=${session.target.observedVersion||'unknown'}\n`;
    }else if(value==='hostname'){
      output=`${session.target.name||session.target.id}\n`;
    }else if(value==='uptime'){
      output=' up 12 days, 3:21, 2 users, load average: 0.31, 0.42, 0.38\n';
    }else if(value==='free -h'){
      output='              total        used        free\nMem:           15Gi       8.2Gi       3.1Gi\n';
    }else if(value==='df -h'){
      output='Filesystem      Size  Used Avail Use% Mounted on\n/dev/sda1        80G   42G   34G  56% /\n';
    }else if(value==='env'){
      output=maskSensitiveOutput('DB_PASSWORD=demo-secret\nLOG_LEVEL=info\n');
    }else if(value==='exit'){
      output='logout\n';
    }else{
      exitCode=127;result='not-found';output=`${value}: command not found in simulated ${session.target.type} terminal\n`;
    }
    const audit=createTerminalAudit(session,'command',{now,command:value,risk:classification.risk,result,exitCode});
    if(session){
      session.lastActivityAt=now;
      session.commands=session.commands||[];
      session.commands.push({command:value,risk:classification.risk,result,exitCode,blocked,time:now});
      session.recording=session.recording||[];
      session.recording.push({time:now,type:'command',command:value,output,blocked,exitCode});
      session.audit=session.audit||[];
      session.audit.push(audit);
    }
    return {output,exitCode,blocked,result,classification,audit};
  }

  root.CloudForgeTerminalDomain=Object.freeze({
    TERMINAL_STATES,
    TERMINAL_TRANSITIONS,
    TERMINAL_ROLES,
    DEFAULT_TTL_SECONDS,
    DEFAULT_IDLE_TIMEOUT_SECONDS,
    canTerminalTransition,
    evaluateTerminalAccess,
    createTerminalAudit,
    createTerminalSession,
    transitionTerminalSession,
    classifyTerminalCommand,
    isTerminalSessionExpired,
    maskSensitiveOutput,
    runSimulatedCommand
  });
})(typeof globalThis!=='undefined'?globalThis:this);
</script>
<script id="release-domain-core">
/* Framework-free release domain core shared by the prototype and Node tests. */
(function(root){
  const RELEASE_STATES=Object.freeze([
    'draft','queued','pending','deploying','validating','paused',
    'rolling_back','rolled_back','partially_rolled_back','success','failed','cancelled'
  ]);
  const RELEASE_TRANSITIONS=Object.freeze({
    draft:['queued','cancelled'],
    queued:['deploying','cancelled','failed'],
    pending:['queued','deploying','cancelled','failed'],
    deploying:['validating','paused','rolling_back','cancelled','failed'],
    validating:['success','paused','rolling_back','cancelled','failed'],
    paused:['deploying','rolling_back','cancelled','failed'],
    rolling_back:['rolled_back','partially_rolled_back','failed'],
    rolled_back:[],
    partially_rolled_back:['rolling_back'],
    success:[],
    failed:['deploying','rolling_back','cancelled'],
    cancelled:['deploying','rolling_back']
  });
  const RELEASE_ACTIONS=Object.freeze({
    draft:{start:'queued',cancel:'cancelled'},
    queued:{start:'deploying',cancel:'cancelled',fail:'failed'},
    pending:{queue:'queued',start:'deploying',cancel:'cancelled',fail:'failed'},
    deploying:{validate:'validating',pause:'paused',rollback:'rolling_back',cancel:'cancelled',fail:'failed'},
    validating:{success:'success',pause:'paused',rollback:'rolling_back',cancel:'cancelled',fail:'failed'},
    paused:{resume:'deploying',rollback:'rolling_back',cancel:'cancelled',fail:'failed'},
    rolling_back:{complete:'rolled_back',partial:'partially_rolled_back',fail:'failed'},
    partially_rolled_back:{rollback:'rolling_back',cancel:'cancelled'},
    success:{},
    failed:{retry:'deploying',rollback:'rolling_back',cancel:'cancelled'},
    cancelled:{retry:'deploying',rollback:'rolling_back'}
  });
  const EDGE_TRANSITIONS=Object.freeze({
    pending:['waiting','paused','deploying','cancelled','failed'],
    waiting:['deploying','paused','cancelled','failed'],
    deploying:['validating','paused','rolling_back','cancelled','failed'],
    validating:['success','paused','rolling_back','cancelled','failed'],
    paused:['deploying','rolling_back','cancelled','failed'],
    rolling_back:['rolled_back','partially_rolled_back','failed'],
    rolled_back:[],
    partially_rolled_back:['rolling_back'],
    success:['rolling_back'],
    failed:['deploying','rolling_back','cancelled'],
    cancelled:['deploying','rolling_back']
  });
  const clone=value=>value===undefined?undefined:JSON.parse(JSON.stringify(value));
  const clampWeight=value=>Math.max(0,Math.min(100,Number(value)||0));
  const normalizeVersion=value=>String(value??'').trim().replace(/^v/i,'');

  function canReleaseTransition(from,to){
    return from===to || (RELEASE_TRANSITIONS[from]||[]).includes(to);
  }
  function releaseActionTarget(from,action){
    return RELEASE_ACTIONS[from]?.[String(action||'').toLowerCase()]||null;
  }
  function canEdgeTransition(from,to){
    return from===to || (EDGE_TRANSITIONS[from]||[]).includes(to);
  }
  function reconcileVersionState(input={}){
    const desiredVersion=String(input.desiredVersion??'').trim();
    const observedVersion=String(input.observedVersion??'').trim();
    const replicas=Math.max(0,Number(input.replicas)||0);
    const ready=Math.max(0,Number(input.ready)||0);
    let status='consistent';
    if(!desiredVersion||!observedVersion)status='missing';
    else if(normalizeVersion(desiredVersion)!==normalizeVersion(observedVersion))status='drift';
    else if(input.nodeOnline===false||(replicas>0&&ready<replicas))status='degraded';
    const result={
      desiredVersion,
      observedVersion,
      reconcileStatus:status,
      ready,
      replicas,
      reconciledAt:input.now||new Date().toISOString()
    };
    result.status=status;
    return result;
  }
  function restoreTrafficBaseline(baseline={}){
    const stableVersion=baseline.stableVersion||'stable';
    const canaryVersion=baseline.canaryVersion||'';
    const primaryWeight=clampWeight(baseline.primaryWeight);
    const candidateWeight=clampWeight(baseline.candidateWeight);
    const subsets=[{
      name:stableVersion,
      weight:primaryWeight,
      labels:{version:stableVersion,track:'stable'}
    }];
    if(canaryVersion&&candidateWeight>0){
      subsets.push({
        name:canaryVersion,
        weight:candidateWeight,
        labels:{version:canaryVersion,track:'canary'}
      });
    }
    return subsets;
  }
  function reconcileEdgeDeployment({deployment={},node={},desiredState={},now}={}){
    const next=clone(deployment);
    const online=node.status==='online';
    if(online){
      const desiredVersion=desiredState.desiredVersion||next.desiredVersion||next.observedVersion||'';
      Object.assign(next,clone(desiredState),{desiredVersion});
      next.observedVersion=desiredVersion;
      next.syncSequence=(Number(next.syncSequence)||0)+1;
      next.lastReportedAt=now||new Date().toISOString();
      next.reconcileStatus=reconcileVersionState({
        desiredVersion,
        observedVersion:next.observedVersion,
        ready:desiredState.ready??next.ready??1,
        replicas:desiredState.replicas??next.replicas??1,
        nodeOnline:true,
        now:next.lastReportedAt
      }).reconcileStatus;
    }else{
      next.reconcileStatus='degraded';
      next.lastReportedAt=next.lastReportedAt||null;
    }
    return {deployment:next,online,changed:online};
  }
  function createAuditEvent(input={}){
    const stamp=Date.now().toString(36);
    const suffix=Math.random().toString(36).slice(2,8);
    return {
      id:input.id||`audit-${stamp}-${suffix}`,
      time:input.time||new Date().toISOString(),
      releaseId:input.releaseId||null,
      action:input.action||'unknown',
      from:input.from??null,
      to:input.to??null,
      actor:input.actor||'当前用户',
      reason:input.reason||'未提供原因',
      health:clone(input.health||null),
      result:input.result||'recorded',
      trafficBefore:clone(input.trafficBefore||null),
      trafficAfter:clone(input.trafficAfter||null),
      baselineVersion:input.baselineVersion||null
    };
  }
  function summarizeReconciliation(items=[]){
    const counts={consistent:0,missing:0,drift:0,degraded:0};
    (items||[]).forEach(item=>{
      const status=item?.reconcileStatus||item?.status;
      if(Object.prototype.hasOwnProperty.call(counts,status))counts[status]+=1;
      else counts.missing+=1;
    });
    return {
      total:counts.consistent+counts.missing+counts.drift+counts.degraded,
      counts,
      consistent:counts.consistent===counts.consistent+counts.missing+counts.drift+counts.degraded,
      checkedAt:new Date().toISOString()
    };
  }

  root.CloudForgeReleaseDomain=Object.freeze({
    RELEASE_STATES,
    RELEASE_TRANSITIONS,
    RELEASE_ACTIONS,
    EDGE_TRANSITIONS,
    canReleaseTransition,
    releaseActionTarget,
    canEdgeTransition,
    normalizeVersion,
    reconcileVersionState,
    restoreTrafficBaseline,
    reconcileEdgeDeployment,
    createAuditEvent,
    summarizeReconciliation
  });
})(typeof globalThis!=='undefined'?globalThis:this);
</script>
<script>
/* CloudForge lifecycle hardening: explicit transition guards + optimistic rollback validation. */
(function(){
  const allowedReleaseTransitions=window.RELEASE_STATUS_TRANSITIONS;
  window.workloadRevisionFingerprint=function(app){
    const ids=new Set();(app?.components||[]).forEach(c=>(componentWorkloadIds(c)||[]).forEach(id=>ids.add(id)));
    Object.keys(WORKLOADS||{}).forEach(id=>{if(WORKLOADS[id]?.appId===app?.id)ids.add(id)});
    return [...ids].sort().map(id=>{const w=WORKLOADS[id]||{};return [id,w.resourceVersion||0,w.image||'',w.replicas??'',w.ready??'',w.updatedAt||'',JSON.stringify(w.resources||{}),JSON.stringify(w.probes||{})].join('|')}).join('||');
  };
  const originalOpenRollbackModal=window.openRollbackModal;
  const originalConfirmRollback=window.confirmRollback;
  let rollbackPreviewFingerprint=null,rollbackPreviewVersion=null,rollbackPreviewAppId=null;
  if(typeof originalOpenRollbackModal==='function')window.openRollbackModal=function(version){
    const app=getApp(state.appId);rollbackPreviewFingerprint=workloadRevisionFingerprint(app);rollbackPreviewVersion=version;rollbackPreviewAppId=app?.id||null;
    return originalOpenRollbackModal.apply(this,arguments);
  };
  if(typeof originalConfirmRollback==='function')window.confirmRollback=function(version){
    const app=getApp(state.appId);
    if(rollbackPreviewAppId && app?.id===rollbackPreviewAppId && version===rollbackPreviewVersion && rollbackPreviewFingerprint!==workloadRevisionFingerprint(app)){
      alert('检测到预览后工作负载状态已变化。为避免覆盖其他操作，请重新检查回滚差异后再确认。');
      rollbackPreviewFingerprint=workloadRevisionFingerprint(app);
      return originalOpenRollbackModal.call(this,version);
    }
    const before=new Set((app?.releases||[]).map(r=>r.id));
    const result=originalConfirmRollback.apply(this,arguments);
    const fresh=(app?.releases||[]).find(r=>!before.has(r.id)) || (app?.releases||[])[0];
    if(fresh){
      fresh.taskType='rollback';fresh.taskId=fresh.taskId||`rollback-${Date.now()}`;fresh.parentReleaseId=fresh.parentReleaseId||`release:${version}`;
      fresh.status='rolled_back';fresh.phase='已回滚';fresh.rolledBackAt=new Date().toLocaleString();
      fresh.transitionHistory=fresh.transitionHistory||[];
      fresh.transitionHistory.unshift({from:'previewed',to:'rolled_back',time:new Date().toLocaleString(),reason:'本地原型中同步完成回滚快照恢复'});
      fresh.resourceFingerprint=workloadRevisionFingerprint(app);
      fresh.events=fresh.events||[];fresh.events.unshift({type:'Normal',time:new Date().toLocaleString(),reason:'RollbackTaskCreated',msg:`创建独立回滚任务 ${fresh.taskId}，目标版本 ${version}`});
      fresh.audit=fresh.audit||[];

<script>
/* CloudForge release safety: preserve traffic baseline and restore it on interrupted canary/blue-green runs. */
(function(){
  const originalExecute=window.executeReleasePlan;
  if(typeof originalExecute!=='function')return;
  function snapshotTraffic(app){
    if(typeof window.getReleaseTrafficBaseline==='function')return window.getReleaseTrafficBaseline(app);
    return {primaryWeight:100,candidateWeight:0,phase:'默认稳定流量'};
  }
  function restoreTraffic(app,r,reason){
    if(!app||!r||!r.trafficBefore)return;
    const before=r.trafficBefore,stableVersion=before.stableVersion||app.version||'stable',canaryVersion=before.canaryVersion||'';
    app.mesh=app.mesh||{};
    delete app.mesh.releaseTraffic;
    (app.components||[]).forEach(c=>{
      if(!c.mesh?.route)return;
      c.mesh.route.subsets=window.CloudForgeReleaseDomain?.restoreTrafficBaseline
        ?window.CloudForgeReleaseDomain.restoreTrafficBaseline(before)
        :[{name:stableVersion,weight:Number(before.primaryWeight)||100,labels:{version:stableVersion,track:'stable'}}];
    });
    (r.releaseTargets||[]).forEach(t=>{t.trafficWeight=t.role==='primary'?Number(before.primaryWeight):Number(before.candidateWeight);});
    r.trafficPhase=`已恢复发布前流量（${reason}）`;
    r.trafficRestoredAt=new Date().toLocaleString();
    r.restoreReason=reason;
    r.restoredFromReleaseId=r.id;
    r.trafficRecoveryReason=reason;
    r.trafficHistory=r.trafficHistory||[];
    r.trafficHistory.push({time:r.trafficRestoredAt,phase:`恢复发布前流量（${reason}）`,primaryWeight:Number(before.primaryWeight),candidateWeight:Number(before.candidateWeight),source:before.source||'snapshot'});
    createReleaseAudit(r,'traffic-restore',r.status,r.status,{reason,result:'restored',trafficBefore:before,trafficAfter:{primaryWeight:Number(before.primaryWeight),candidateWeight:Number(before.candidateWeight),stableVersion,canaryVersion},baselineVersion:before.stableVersion||r.versionBefore});
    recordReleaseEvent(r,'Warning','ReleaseTrafficRestored',`发布未成功，已恢复发布前流量策略：${stableVersion} ${Number(before.primaryWeight)}% / ${canaryVersion||'无灰度版本'} ${Number(before.candidateWeight)}%；临时发布流量已清除`);
  }
  window.restoreReleaseTrafficBaseline=restoreTraffic;
  window.executeReleasePlan=async function(appId,releaseId,fullOrder,executionToken){
    const app=getApp(appId),r=app?.releases?.find(x=>x.id===releaseId);
    if(!app||!r)return originalExecute.apply(this,arguments);
    if(!r.trafficBefore)r.trafficBefore=snapshotTraffic(app);
    r.trafficHistory=r.trafficHistory||[];
    r.trafficHistory.push({time:new Date().toLocaleString(),phase:'开始执行',primaryWeight:r.trafficBefore.primaryWeight,candidateWeight:r.trafficBefore.candidateWeight});
    persistDemoState();
    try{await originalExecute.apply(this,arguments);}catch(err){
      const freshApp=getApp(appId),fresh=freshApp?.releases?.find(x=>x.id===releaseId);
      if(fresh&&isReleaseExecutionCurrent(fresh,executionToken)){
        const failureReason=String(err?.message||err||'未知执行异常');
        if(transitionReleaseStatus(fresh,'failed',{reason:'ReleaseExecutionError',type:'Warning',message:`发布执行异常：${failureReason}`})){
          fresh.phase='执行异常';fresh.failureReason=failureReason;fresh.time=new Date().toLocaleString();
        }
      }
    }
    const freshApp=getApp(appId),fresh=freshApp?.releases?.find(x=>x.id===releaseId);
    if(!freshApp||!fresh)return;
    if(['paused','failed','cancelled'].includes(fresh.status)){
      const current=freshApp.mesh?.releaseTraffic;
      const changed=current?.releaseId===fresh.id&&(Number(current.primaryWeight)!==Number(fresh.trafficBefore.primaryWeight)||Number(current.candidateWeight)!==Number(fresh.trafficBefore.candidateWeight));
      if(changed)restoreTraffic(freshApp,fresh,fresh.status==='paused'?'健康门禁暂停':fresh.status==='cancelled'?'用户取消':'发布失败');
      const active=(freshApp.releases||[]).filter(x=>x.id!==fresh.id&&RELEASE_ACTIVE_STATUSES.includes(x.status));
      freshApp.deployStatus=active.some(x=>x.status==='deploying')?'deploying':active.some(x=>x.status==='paused')?'paused':fresh.status;
      persistDemoState();
    }
  };
  const originalRollbackTargets=window.rollbackCompletedReleaseTargets;
  if(typeof originalRollbackTargets==='function')window.rollbackCompletedReleaseTargets=function(appId,releaseId){
    const app=getApp(appId),r=app?.releases?.find(x=>x.id===releaseId);
    const activeTrafficReleaseId=app?.mesh?.releaseTraffic?.releaseId;
    const result=originalRollbackTargets.apply(this,arguments);
    const freshApp=getApp(appId),fresh=freshApp?.releases?.find(x=>x.id===releaseId);
    if(freshApp&&fresh&&fresh.trafficBefore&&fresh.recoveryState==='completed-targets-rolled-back'&&(activeTrafficReleaseId===releaseId||freshApp.mesh?.releaseTraffic?.releaseId===releaseId)){
      restoreTraffic(freshApp,fresh,'已完成目标部分回滚');persistDemoState();
    }
    return result;
  };
  window.releaseTrafficRecoveryRules={
    interruptedStatuses:['paused','failed','cancelled'],
    behavior:'蓝绿/灰度发布被暂停、失败或取消时，恢复任务启动前记录的流量策略与路由，并清除临时发布流量；成功发布保留最终切流结果。',
    simulated:true
  };
})();
</script>

<script>
/* CloudForge release lifecycle guard: app-level mutual exclusion and consistent terminal summaries. */
(function(){
  const ACTIVE = new Set(window.RELEASE_ACTIVE_STATUSES||['pending','queued','validating','deploying','paused']);
  function findApp(appId){ return typeof getApp==='function' ? getApp(appId) : null; }
  function activeTasks(app, exceptId){ return (app?.releases||[]).filter(r=>r.id!==exceptId && ACTIVE.has(r.status)); }
  function syncAppReleaseSummary(app, currentRelease){
    if(!app)return;
    const active=activeTasks(app);
    if(active.some(r=>r.status==='deploying')) app.deployStatus='deploying';
    else if(active.some(r=>r.status==='validating')) app.deployStatus='validating';
    else if(active.some(r=>r.status==='rolling_back')) app.deployStatus='rolling_back';
    else if(active.some(r=>r.status==='paused')) app.deployStatus='paused';
    else if(currentRelease?.status==='success') app.deployStatus='success';
    else if(currentRelease?.status==='rolled_back') app.deployStatus='rolled_back';
    else if(currentRelease?.status==='partially_rolled_back') app.deployStatus='partial';
    else if(currentRelease?.status==='cancelled') app.deployStatus='cancelled';
    else if(currentRelease?.status==='failed') app.deployStatus='failed';
    app.releaseSummary=app.releaseSummary||{};
    app.releaseSummary.activeTaskId=active[0]?.id||null;
    app.releaseSummary.activeTaskCount=active.length;
    app.releaseSummary.checkedAt=new Date().toLocaleString();
    app.releaseSummary.consistent=active.length<=1;
  }
  const originalConfirmPublish=window.confirmPublish;
  if(typeof originalConfirmPublish==='function') window.confirmPublish=function(){
    const app=findApp(state.appId);
    const active=activeTasks(app);
    if(active.length){
      const task=active[0];
      alert(`当前应用已有发布任务「${task.version}」（${task.status==='paused'?'已暂停':'执行中'}）。请先恢复、取消或完成该任务，再创建新发布。`);
      return;
    }
    return originalConfirmPublish.apply(this,arguments);
  };
  const originalRetry=window.retryReleaseTask;
  if(typeof originalRetry==='function') window.retryReleaseTask=function(appId,releaseId){
    const app=findApp(appId),r=app?.releases?.find(x=>x.id===releaseId);
    if(!app||!r)return alert('找不到要重试的发布任务');
    const active=activeTasks(app,releaseId);
    if(active.length)return alert(`应用已有其他活动任务「${active[0].version}」，不能并发重试。`);
    if(!['failed','cancelled'].includes(r.status))return alert('仅失败或已取消的发布任务支持重试；暂停任务请使用“恢复”。');
    const result=originalRetry.apply(this,arguments);
    syncAppReleaseSummary(findApp(appId),findApp(appId)?.releases?.find(x=>x.id===releaseId));
    persistDemoState();
    return result;
  };
  const originalResume=window.resumePausedRelease;
  if(typeof originalResume==='function') window.resumePausedRelease=function(appId,releaseId){
    const app=findApp(appId),r=app?.releases?.find(x=>x.id===releaseId);
    if(!app||!r||r.status!=='paused')return alert('找不到可恢复的暂停发布任务');
    const active=activeTasks(app,releaseId);
    if(active.length)return alert(`应用已有其他活动任务「${active[0].version}」，不能并发恢复。`);
    const result=originalResume.apply(this,arguments);
    syncAppReleaseSummary(findApp(appId),findApp(appId)?.releases?.find(x=>x.id===releaseId));
    persistDemoState();
    return result;
  };
  const originalCancel=window.cancelReleaseTask;
  if(typeof originalCancel==='function') window.cancelReleaseTask=function(appId,releaseId){
    const result=originalCancel.apply(this,arguments);
    const app=findApp(appId),r=app?.releases?.find(x=>x.id===releaseId);
    syncAppReleaseSummary(app,r);
    if(app)persistDemoState();
    return result;
  };
  const originalExecute=window.executeReleasePlan;
  if(typeof originalExecute==='function') window.executeReleasePlan=async function(appId,releaseId,fullOrder,token){
    const app=findApp(appId),r=app?.releases?.find(x=>x.id===releaseId);
    if(!app||!r)return originalExecute.apply(this,arguments);
    const competing=activeTasks(app,releaseId);
    if(competing.length){
      recordReleaseEvent(r,'Warning','ConcurrentExecutionBlocked',`检测到活动任务 ${competing[0].version}，已阻止并发执行`);
      persistDemoState();
      return;
    }
    r.executionOwner={token:Number(token),startedAt:new Date().toLocaleString()};
    syncAppReleaseSummary(app,r);persistDemoState();
    try { return await originalExecute.apply(this,arguments); }
    finally {
      const freshApp=findApp(appId),fresh=freshApp?.releases?.find(x=>x.id===releaseId);
      if(fresh && Number(fresh.executionOwner?.token)===Number(token)){
        fresh.executionOwner.finishedAt=new Date().toLocaleString();
        syncAppReleaseSummary(freshApp,fresh);
        persistDemoState();
      }
    }
  };
  const originalDetails=window.openReleaseTaskDetails;
  if(typeof originalDetails==='function') window.openReleaseTaskDetails=function(releaseId){
    const app=findApp(state.appId),r=app?.releases?.find(x=>x.id===releaseId);
    const result=originalDetails.apply(this,arguments);
    if(!r)return result;
    const root=document.querySelector('#modal-root');
    if(root){
      const history=Array.isArray(r.trafficHistory)?r.trafficHistory:[];
      const trafficHtml=history.length?history.slice(-8).reverse().map(h=>`<div class="timeline-item"><div class="timeline-dot"></div><div><b>${escapeHtml(h.phase||'流量状态')}</b><div class="release-meta">${escapeHtml(h.time||'—')} · 稳定 ${Number(h.primaryWeight)||0}% / 候选 ${Number(h.candidateWeight)||0}%</div></div></div>`).join(''):'<div class="empty">该任务暂无流量阶段记录</div>';
      const box=document.createElement('div');box.innerHTML=`<div class="section-title" style="margin-top:14px">流量与任务一致性</div><div class="validation-box ${r.status==='success'?'success':ACTIVE.has(r.status)?'warn':'info'}">任务状态：${escapeHtml(r.status)} · 流量阶段：${escapeHtml(r.trafficPhase||'未切流')} · ${r.trafficRestoredAt?'已恢复发布前流量：'+escapeHtml(r.trafficRestoredAt):'尚无异常恢复记录'}</div><div class="timeline">${trafficHtml}</div>`;
      const timeline=[...root.querySelectorAll('.section-title')].find(el=>el.textContent.includes('任务事件'));
      if(timeline)timeline.parentNode.insertBefore(box,timeline);else root.appendChild(box);
    }
    return result;
  };
  window.releaseLifecycleGuard={activeStatuses:[...ACTIVE],policy:'每个应用最多一个活动发布任务；恢复、重试和执行入口均进行并发检查；终态后重新计算应用发布摘要。',simulated:true};
})();
</script>


<script>
/* Release result verification: separate task success from application-wide version consistency. */
(function(){
  const tagOf = image => { const value=String(image||''); const i=value.lastIndexOf(':'); return i>value.lastIndexOf('/') ? value.slice(i+1) : ''; };
  function rowsFor(app){ return typeof getReleaseWorkloadRows==='function' ? getReleaseWorkloadRows(app) : []; }
  function checkReleaseResult(app, release){
    const rows=rowsFor(app), strategy=String(release.strategy||'滚动发布');
    const targetIds=new Set(release.targetWorkloadIds||[]);
    const candidateIds=new Set((release.releaseTargets||[]).filter(t=>t.role==='candidate').map(t=>t.workloadId));
    const targetRows=rows.filter(row=>targetIds.has(row.id));
    const relevant=strategy.includes('蓝绿')||strategy.includes('灰度')
      ? targetRows.filter(row=>candidateIds.has(row.id))
      : targetRows;
    const expected=String(release.version||'').replace(/^v/,'');
    const checks=relevant.map(row=>{
      const actual=tagOf(row.workload.image).replace(/^v/,'');
      const ready=Number(row.workload.ready)>=Number(row.workload.replicas)&&Number(row.workload.replicas)>0;
      const reconciled=window.CloudForgeReleaseDomain?.reconcileVersionState?.({
        desiredVersion:row.workload.desiredVersion||release.version,
        observedVersion:row.workload.observedVersion||actual,
        ready:row.workload.ready,replicas:row.workload.replicas,nodeOnline:true
      });
      const versionOk=actual===expected&&(!reconciled||reconciled.status==='consistent');
      return {workloadId:row.id,name:workloadDisplayName(row.id,row.workload),image:row.workload.image||'',actualVersion:actual,expectedVersion:expected,desiredVersion:row.workload.desiredVersion||release.version,reconcileStatus:reconciled?.status||'missing',selected:true,ready,versionOk,ok:versionOk&&ready};
    });
    const unselected=rows.filter(row=>!targetIds.has(row.id));
    const failed=checks.filter(x=>!x.ok);
    const trafficOk=!isCapabilityEnabled('service-mesh')||!(strategy.includes('蓝绿')||strategy.includes('灰度')) || Number(app.mesh?.releaseTraffic?.candidateWeight)===100;
    const complete=checks.length>0 && failed.length===0 && trafficOk;
    return {checkedAt:new Date().toLocaleString(),strategy,expectedVersion:release.version,complete,trafficOk,checkedCount:checks.length,failedCount:failed.length,unselectedCount:unselected.length,checks,summary:complete?'目标版本、就绪状态与流量均符合预期':`存在 ${failed.length} 个版本/就绪不一致目标${trafficOk?'':'，候选流量未达到 100%'}`};
  }
  function commitReleaseTraffic(app,release){
    const strategy=String(release.strategy||'滚动发布');
    if(!strategy.includes('蓝绿')&&!strategy.includes('灰度'))return;
    const current=app.mesh?.releaseTraffic;
    if(Number(current?.candidateWeight)!==100)return;
    const time=new Date().toLocaleString();
    app.trafficPolicy={...(app.trafficPolicy||{}),enabled:false,stableVersion:release.version,canaryVersion:'',canaryWeight:0};
    (app.components||[]).forEach(c=>{if(c.mesh?.route)c.mesh.route.subsets=[{name:release.version,weight:100,labels:{version:release.version,track:'stable'}}];});
    app.mesh.releaseTraffic={...current,releaseId:release.id,version:release.version,phase:'候选版本已提交为稳定流量',primaryWeight:100,candidateWeight:0,updatedAt:time};
    release.trafficPhase='候选版本已提交为稳定流量';
    release.trafficHistory=release.trafficHistory||[];
    release.trafficHistory.push({time,phase:'校验通过，候选版本提交为稳定流量',primaryWeight:100,candidateWeight:0});
    release.trafficCommittedAt=time;
  }
  const originalExecute=window.executeReleasePlan;
  if(typeof originalExecute==='function') window.executeReleasePlan=async function(appId,releaseId,fullOrder,token){
    const beforeApp=typeof getApp==='function'?getApp(appId):null;
    const previousState={version:beforeApp?.version,updatedAt:beforeApp?.updatedAt,status:beforeApp?.status,deployStatus:beforeApp?.deployStatus};
    const result=await originalExecute.apply(this,arguments);
    const app=typeof getApp==='function'?getApp(appId):null;
    const release=app?.releases?.find(r=>r.id===releaseId);
    if(!app||!release||!['validating','success'].includes(release.status))return result;
    const report=checkReleaseResult(app,release);
    release.beforeSnapshot=release.beforeSnapshot||release.snapshot;
    release.versionConsistency=report;
    release.verifiedAt=report.checkedAt;
    release.versionState=release.versionState||{};
    if(report.complete){
      const appliedAt=new Date().toLocaleString();
      if(release.status==='validating'&&!transitionReleaseStatus(release,'success',{action:'reconcile',reason:'VersionReconciliationPassed',health:{checks:report.checkedCount,failed:report.failedCount},result:'consistent',message:`版本对账通过：${report.checkedCount} 个目标期望版本与运行版本一致`}))return result;
      app.version=release.version;
      app.updatedAt=appliedAt;
      app.status='healthy';
      app.deployStatus='success';
      app.releases.forEach(r=>r.current=r.id===release.id);
      syncAppliedConfigAfterRelease(app,release);
      commitReleaseTraffic(app,release);
      syncGatewayAfterRelease(app,release);
      release.versionState.runtimeVersionAfter=observedReleaseVersions(app,release);
      release.versionState.verified=true;
      release.versionState.applied=true;
      release.versionState.verifiedAt=report.checkedAt;
      release.versionState.appliedAt=appliedAt;
      release.appliedAt=appliedAt;
      release.trafficAfter=app.mesh?.releaseTraffic?JSON.parse(JSON.stringify(app.mesh.releaseTraffic)):null;
      app.versionConsistency={status:'consistent',checkedAt:report.checkedAt,version:release.version,desiredVersion:release.version,observedVersions:[...new Set((report.checks||[]).map(x=>x.actualVersion).filter(Boolean))],reconcileCounts:{consistent:report.checkedCount,failed:report.failedCount},summary:'发布结果校验通过，应用版本、运行镜像、配置与流量已提交'};
      release.afterSnapshot=captureReleaseSnapshot(app,release.version,release.targetWorkloadIds);
      recordReleaseEvent(release,'Normal','ReleaseResultApplied',`发布结果校验通过并完成原子提交：${report.checkedCount} 个目标版本和就绪状态符合预期，应用版本更新为 ${release.version}`);
    }else{
      // The task itself completed, but it must not become the application's current version.
      if(release.status==='validating'&&!transitionReleaseStatus(release,'failed',{action:'reconcile',reason:'VersionReconciliationFailed',health:{checks:report.checkedCount,failed:report.failedCount},result:'inconsistent',message:report.summary}))return result;
      app.version=previousState.version??app.version;
      app.updatedAt=previousState.updatedAt;
      app.status=previousState.status;
      app.versionConsistency={status:'inconsistent',checkedAt:report.checkedAt,version:release.version,desiredVersion:release.version,observedVersions:[...new Set((report.checks||[]).map(x=>x.actualVersion).filter(Boolean))],reconcileCounts:{consistent:Math.max(0,report.checkedCount-report.failedCount),failed:report.failedCount},summary:report.summary,failedCount:report.failedCount,unselectedCount:report.unselectedCount};
      app.deployStatus='partial';
      release.current=false;
      if(typeof window.restoreReleaseTrafficBaseline==='function')window.restoreReleaseTrafficBaseline(app,release,'发布结果校验不一致');
      release.versionState.runtimeVersionAfter=observedReleaseVersions(app,release);
      release.versionState.verified=false;
      release.versionState.applied=false;
      release.versionState.verifiedAt=report.checkedAt;
      release.versionState.inconsistentReason=report.summary;
      release.trafficAfter=JSON.parse(JSON.stringify(release.trafficBefore||{}));
      release.afterSnapshot=captureReleaseSnapshot(app,release.version,release.targetWorkloadIds);
      recordReleaseEvent(release,'Warning','ReleaseResultInconsistent',`${report.summary}；应用当前版本保持为 ${app.version||'未知'}，未将本次任务标记为应用当前版本`);
    }

    return result;
  };
  const originalStatusMeta=window.releaseStatusMeta;
  if(typeof originalStatusMeta==='function') window.releaseStatusMeta=function(status){
    if(status==='partial')return ['部分成功','amber'];
    return originalStatusMeta.apply(this,arguments);
  };
  const originalDetails=window.openReleaseTaskDetails;
  if(typeof originalDetails==='function') window.openReleaseTaskDetails=function(releaseId){
    const app=typeof getApp==='function'?getApp(state.appId):null;
    const release=app?.releases?.find(r=>r.id===releaseId);
    const result=originalDetails.apply(this,arguments);
    if(!release)return result;
    const root=document.querySelector('#modal-root');
    if(root){
      const report=release.versionConsistency;
      const insertBeforeEventPanel=panel=>{
        const eventTitle=[...root.querySelectorAll('.section-title')].find(el=>el.textContent.includes('任务事件'));
        if(eventTitle)eventTitle.parentNode.insertBefore(panel,eventTitle);else root.appendChild(panel);
      };
      if(report){
        const rows=(report.checks||[]).map(x=>`<tr><td>${escapeHtml(x.name||x.workloadId)}</td><td>${escapeHtml(x.actualVersion||'未知')}</td><td>${escapeHtml(x.expectedVersion||release.version)}</td><td><span class="badge ${x.reconcileStatus==='consistent'?'green':x.reconcileStatus==='drift'?'red':'amber'}">${escapeHtml(x.reconcileStatus||'未知')}</span></td><td>${x.ready?'就绪':'未就绪'}</td><td>${x.ok?'一致':'不一致'}</td></tr>`).join('');
        const panel=document.createElement('div');
        panel.innerHTML=`<div class="section-title" style="margin-top:14px">发布结果校验</div><div class="validation-box ${report.complete?'success':'warn'}">${escapeHtml(report.summary||'尚无校验摘要')} · 校验时间 ${escapeHtml(report.checkedAt||'—')}<br>检查目标 ${Number(report.checkedCount)||0} 个 · 不一致目标 ${Number(report.failedCount)||0} 个 · 未选择目标 ${Number(report.unselectedCount)||0} 个</div><div style="max-height:220px;overflow:auto"><table class="data-table"><thead><tr><th>工作负载</th><th>实际版本</th><th>期望版本</th><th>对账</th><th>就绪</th><th>结果</th></tr></thead><tbody>${rows||'<tr><td colspan="6">暂无校验明细</td></tr>'}</tbody></table></div>`;
        insertBeforeEventPanel(panel);
      }
      const auditEvents=Array.isArray(release.audit)?release.audit:[];
      const auditRows=auditEvents.map(event=>`<div style="padding:11px 12px;border:1px solid var(--border);border-radius:9px;background:#fff"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${escapeHtml(event.action||'transition')}</b><span class="badge ${event.result==='denied'?'red':event.result==='consistent'||event.result==='restored'?'green':'gray'}">${escapeHtml(event.result||'recorded')}</span><span class="muted">${escapeHtml(event.from||'—')} → ${escapeHtml(event.to||'—')}</span></div><div class="release-meta" style="margin-top:5px">${escapeHtml(event.time||'—')} · ${escapeHtml(event.actor||'—')}</div><div style="margin-top:6px;font-size:12px;overflow-wrap:anywhere">${escapeHtml(event.reason||'—')}</div><div class="release-meta" style="margin-top:6px">基线 ${escapeHtml(event.baselineVersion||'—')} · 流量 ${Number(event.trafficBefore?.primaryWeight)||0}/${Number(event.trafficBefore?.candidateWeight)||0} → ${Number(event.trafficAfter?.primaryWeight)||0}/${Number(event.trafficAfter?.candidateWeight)||0}</div></div>`).join('');
      const auditPanel=document.createElement('div');
      auditPanel.innerHTML=`<div class="section-title" style="margin-top:14px">结构化审计</div><div class="validation-box info">记录操作者、状态前后值、健康检查、结果、发布基线与流量快照。${release.versionBefore?` 发布基线版本：${escapeHtml(release.versionBefore)}。`:''}</div><div style="display:grid;gap:8px;max-height:280px;overflow:auto">${auditRows||'<div class="empty">该任务尚无结构化审计记录</div>'}</div>`;
      insertBeforeEventPanel(auditPanel);
      if(['deploying','validating'].includes(release.status)){
        const actions=root.querySelector('.modal-actions');
        if(actions){
          const pauseButton=document.createElement('button');
          pauseButton.className='btn';
          pauseButton.textContent='暂停发布任务';
          pauseButton.setAttribute('onclick',`pauseReleaseTask('${app.id}','${release.id}')`);
          actions.insertBefore(pauseButton,actions.firstChild);
        }
      }
    }
    return result;
  };
  window.releaseResultVerifier={policy:'发布任务成功不等于应用全局版本一致；只有目标镜像、就绪状态与切流结果通过校验，才更新应用当前版本。',simulated:true};
})();
</script>

<script>
/* Gateway routing workbench: master route list + selected-route detail. */
(function(){
  const TABS=new Set(['route','traffic','checks']);
  function selectedGatewayRoute(app=selectedGatewayApp()){
    const gatewayApp=app||selectedGatewayApp();
    if(!gatewayApp)return null;
    let route=gatewayApp.routes.find(item=>item.id===state.gatewayRouteId);
    if(!route)route=gatewayApp.routes[0]||null;
    state.gatewayRouteId=route?.id||null;

  function selectGatewayRoute(routeId){
    const app=selectedGatewayApp();

  function setGatewayWorkspaceTab(tab){
    state.gatewayTab=TABS.has(tab)?tab:'route';
    render();
  }
  function setGatewayApplication(appId){
    if(!getApp(appId))return;
    state.gatewayAppId=appId;
    state.gatewayRouteId=null;
    state.gatewayTab='route';

  function gatewayRouteTarget(app,route){return app.components.find(component=>component.id===route?.targetId)||null;}

      <div class="gateway-route-match"><code>${escapeHtml(route.host||'未配置 Host')}</code><code>${escapeHtml(route.path||'/')}</code></div>
      <div class="gateway-route-target"><span>${target?`${escapeHtml(target.name)} · ${escapeHtml(String(route.targetPort||target.port||'—'))}`:'<span class="badge red">目标不存在</span>'}</span><span>${escapeHtml(route.method||'匹配所有')}</span></div>

  function gatewayTrafficTabHTML(policy){

      <label style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><input type="checkbox" id="traffic-enabled" ${policy.enabled?'checked':''} onchange="document.getElementById('traffic-controls').style.opacity=this.checked?'1':'.45';document.getElementById('traffic-controls').style.pointerEvents=this.checked?'auto':'none'"> 启用灰度流量分配</label>
      <div id="traffic-controls" style="opacity:${policy.enabled?'1':'.45'};pointer-events:${policy.enabled?'auto':'none'}">
        <div class="gateway-kv"><div class="k">稳定版本</div><div><input class="form-control" id="stable-version" value="${escapeHtml(policy.stableVersion||'')}" maxlength="40"></div></div>
        <div class="gateway-kv"><div class="k">灰度版本</div><div><input class="form-control" id="canary-version" value="${escapeHtml(policy.canaryVersion||'')}" maxlength="40"></div></div>

  function gatewayChecksTabHTML(app){
    return `<div><div class="gateway-panel-head" style="margin-bottom:10px"><div><h2>配置检查</h2><p>快速发现入口、路由和灰度策略中的常见问题。</p></div></div><div class="gateway-check-list">${gatewayValidation(app).map(item=>`<div class="gateway-check-item"><span class="gateway-check-icon ${item.level==='error'?'error':item.level==='warn'?'warn':'ok'}">${item.level==='ok'?'✓':'!'}</span><div><b>${escapeHtml(item.title)}</b><div>${escapeHtml(item.detail)}</div></div></div>`).join('')}</div></div>`;

  function gatewayRouteTabHTML(app,route){
    if(!route)return '<div class="gateway-detail-empty"><b>尚未选择路由</b><span>从左侧选择一条路由，或新增第一条路由规则。</span><div style="margin-top:14px"><button class="btn primary" onclick="editGatewayRoute()">新增路由</button></div></div>';

    <div class="gateway-detail-grid">
      <div class="gateway-detail-field"><span>域名 Host</span><b>${escapeHtml(route.host||'—')}</b></div>
      <div class="gateway-detail-field"><span>路径 Path</span><code>${escapeHtml(route.path||'/')}</code></div>
      <div class="gateway-detail-field"><span>请求方法</span><b>${escapeHtml(route.method||'匹配所有')}</b></div>
      <div class="gateway-detail-field"><span>目标服务</span><b>${target?escapeHtml(target.name):'目标不存在'}</b></div>
      <div class="gateway-detail-field"><span>目标端口</span><b>${escapeHtml(String(route.targetPort||target?.port||'—'))}</b></div>
      <div class="gateway-detail-field"><span>协议</span><b>${escapeHtml(route.protocol||'HTTP')}</b></div>
    </div>
    <div class="gateway-settings-grid">
      <div><h3>转发模式</h3><select class="form-control" onchange="setGatewayMode(this.value)"><option value="app-gateway" ${cfg.mode==='app-gateway'?'selected':''}>经应用网关转发</option><option value="direct-service" ${cfg.mode==='direct-service'?'selected':''}>集群入口直达 Service</option></select><div class="form-help">应用网关未启用时自动使用直连模式。</div></div>
      <div><h3>应用入口地址</h3><div class="gateway-settings-value">${escapeHtml(cfg.address||'尚未配置')}</div><div class="form-help">资源版本 v${Number(ensureGatewayRevision(app).resourceVersion)||1} · ${cfg.clusterIngressEnabled?'集群入口已启用':'集群入口已停用'}</div></div>
    </div>`;
  }
  function viewGatewayWorkbench(){
    if(!APPS.length)return '<div class="page"><h1>网关与路由</h1><div class="empty">暂无应用</div></div>';
    const app=selectedGatewayApp(),revision=ensureGatewayRevision(app),cfg=app.gatewayConfig,policy=app.trafficPolicy,route=selectedGatewayRoute(app);
    const tab=TABS.has(state.gatewayTab)?state.gatewayTab:'route';
    const appOptions=APPS.map(item=>`<option value="${escapeHtml(item.id)}" ${item.id===app.id?'selected':''}>${escapeHtml(item.name)}</option>`).join('');
    const routes=app.routes||[],enabledRoutes=routes.filter(item=>item.enabled);
    const routeList=routes.length?routes.map(item=>gatewayRouteItemHTML(app,item,route?.id)).join(''):`<div class="gateway-route-empty"><b>暂无路由规则</b><span>新增路由后，可在这里查看和管理匹配规则。</span><div style="margin-top:12px"><button class="btn primary" onclick="editGatewayRoute()">新增路由</button></div></div>`;
    const detailContent=tab==='traffic'?gatewayTrafficTabHTML(policy):tab==='checks'?gatewayChecksTabHTML(app):gatewayRouteTabHTML(app,route);
    const routeTarget=route?gatewayRouteTarget(app,route):null;
    return `<div class="page gateway-workbench-page">
      <div class="page-head gateway-page-head"><div><h1>网关与路由</h1><div class="sub">按路由管理入口、转发目标、灰度策略与配置检查</div></div><div class="gateway-page-actions"><span class="badge ${revision.pending?'amber':'green'}">${revision.pending?'期望配置待发布':'配置已生效'}</span><label for="gateway-app-select" style="color:var(--text2);font-size:12px">当前应用</label><select id="gateway-app-select" class="form-control" onchange="setGatewayApplication(this.value)">${appOptions}</select><button class="btn primary" onclick="editGatewayRoute()">${ico.plus} 新增路由</button></div></div>
      <div class="gateway-context-strip">
        <div class="gateway-context-item"><div class="gateway-context-action"><span>集群统一入口</span><button class="btn sm" onclick="toggleClusterIngress()">${cfg.clusterIngressEnabled?'停用':'启用'}</button></div><b style="color:${cfg.clusterIngressEnabled?'var(--green)':'var(--red)'}">${cfg.clusterIngressEnabled?'已启用':'未启用'}</b><small>${escapeHtml(cfg.address||'尚未配置应用入口')}</small></div>
